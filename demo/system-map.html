<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Observstory System Map · XL LAB example</title>
<style>
:root{--bg:#f4f1ea;--paper:#fffdf8;--ink:#181714;--muted:#747168;--line:#d8d2c6;--accent:#8c4636}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:28px 34px 18px;background:var(--paper);border-bottom:1px solid var(--line)}h1{margin:0;font-size:24px;letter-spacing:-.03em}header p{margin:6px 0 0;color:var(--muted)}
.toolbar{display:flex;gap:8px;align-items:center;padding:11px 34px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
button,select{font:inherit;background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:7px 10px}button.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
main{display:grid;grid-template-columns:minmax(0,1fr) 310px;min-height:calc(100vh - 120px)}#map{padding:30px;overflow:auto}#groups{display:flex;gap:28px;align-items:flex-start;min-width:max-content}
.group{width:260px}.group h2{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);padding-bottom:7px;border-bottom:1px solid var(--line)}
.node{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:7px;padding:11px 12px;margin:9px 0;cursor:pointer}
.node.established{border-left-color:var(--ink)}.node.observed{border-left-color:#777}.node.questioned{border-style:dashed}.node.deprecated{opacity:.45}.node.selected{outline:1px solid var(--ink)}
.kind{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}strong{display:block;margin:3px 0 6px}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 6px;font-size:10px;color:var(--muted);margin-right:4px}
aside{background:var(--paper);border-left:1px solid var(--line);padding:24px;position:sticky;top:50px;height:calc(100vh - 50px);overflow:auto}aside h3{margin-top:0}dt{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-top:14px}dd{margin:3px 0 0}
ul{padding-left:18px}.editor{border-top:1px solid var(--line);margin-top:18px;padding-top:15px}.editor label{display:block;font-size:11px;color:var(--muted);margin:8px 0 3px}.editor input,.editor textarea,.editor select{width:100%;font:inherit;border:1px solid var(--line);border-radius:4px;padding:6px;background:white}.editor textarea{min-height:70px}
#export{margin-left:auto}
@media(max-width:800px){main{grid-template-columns:1fr}aside{position:static;height:auto;border-left:0;border-top:1px solid var(--line)}#groups{display:block;min-width:0}.group{width:auto}}
</style>
</head>
<body>
<header><h1>System Map · XL LAB example</h1><p>Interactive example of <code>observstory.system-map/v0</code>: semantic architecture, epistemic status, basis and evidence — no canonical coordinates.</p></header>
<div class="toolbar">
<select id="view"><option value="">All architecture</option></select>
<button data-filter="all" class="active">All</button>
<button data-filter="established">Established</button>
<button data-filter="candidate">Candidate</button>
<button data-filter="questioned">Questioned</button>
<button id="edit">Edit semantics</button>
<button id="export">Export JSON</button>
</div>
<main><section id="map"><div id="groups"></div></section><aside id="inspector">Select a component to inspect its status, basis, evidence and relationships.</aside></main>
<script>
let model=JSON.parse("{\n  \"schema\": \"observstory.system-map/v0\",\n  \"title\": \"XL LAB\",\n  \"purpose\": \"One file. Many interpreters. Show where their realities diverge.\",\n  \"groups\": [\n    {\n      \"id\": \"experience\",\n      \"label\": \"Experience\",\n      \"order\": 1,\n      \"description\": \"What the investigator touches.\"\n    },\n    {\n      \"id\": \"core\",\n      \"label\": \"Lab core\",\n      \"order\": 2,\n      \"description\": \"Project-owned semantic and provenance layer.\"\n    },\n    {\n      \"id\": \"instruments\",\n      \"label\": \"Instruments\",\n      \"order\": 3,\n      \"description\": \"Replaceable workbook consumers and analysis tools.\"\n    }\n  ],\n  \"nodes\": [\n    {\n      \"id\": \"web-ui\",\n      \"kind\": \"experience\",\n      \"label\": \"Forensic workbench\",\n      \"description\": \"Evidence tray, microscope, instrument rack, notebook and light-table comparison surface.\",\n      \"group\": \"experience\",\n      \"status\": \"established\",\n      \"basis\": \"human-declared\",\n      \"evidence\": [\n        {\n          \"ref\": \"../docs/lab-experience.md\",\n          \"label\": \"Lab experience\",\n          \"kind\": \"human\"\n        }\n      ]\n    },\n    {\n      \"id\": \"specimen\",\n      \"kind\": \"domain\",\n      \"label\": \"Immutable specimen\",\n      \"description\": \"Original workbook identified by SHA-256; mutations create derived specimens.\",\n      \"group\": \"core\",\n      \"status\": \"established\",\n      \"basis\": \"human-declared\",\n      \"evidence\": [\n        {\n          \"ref\": \"../README.md\",\n          \"label\": \"XL LAB principles\",\n          \"kind\": \"human\"\n        },\n        {\n          \"ref\": \"../docs/lab-experience.md\",\n          \"label\": \"Evidence tray\",\n          \"kind\": \"human\"\n        }\n      ]\n    },\n    {\n      \"id\": \"experiment\",\n      \"kind\": \"domain\",\n      \"label\": \"Experiment\",\n      \"description\": \"Question, prediction, inputs, bounded procedure, observations, interpretation and falsifier.\",\n      \"group\": \"core\",\n      \"status\": \"established\",\n      \"basis\": \"human-declared\",\n      \"evidence\": [\n        {\n          \"ref\": \"../docs/lab-experience.md\",\n          \"label\": \"Experiment anatomy\",\n          \"kind\": \"human\"\n        }\n      ]\n    },\n    {\n      \"id\": \"adapter-registry\",\n      \"kind\": \"component\",\n      \"label\": \"Environment adapter registry\",\n      \"description\": \"Replaceable consumers expose capabilities, observation, effects and cleanup through a common contract.\",\n      \"group\": \"core\",\n      \"status\": \"candidate\",\n      \"basis\": \"research\",\n      \"evidence\": [\n        {\n          \"ref\": \"../docs/environment-adapters.md\",\n          \"label\": \"Environment adapter architecture\",\n          \"kind\": \"research\"\n        }\n      ]\n    },\n    {\n      \"id\": \"observation-envelope\",\n      \"kind\": \"domain\",\n      \"label\": \"Observation envelope\",\n      \"description\": \"Small common envelope preserving adapter identity, specimen identity, probe and effects without flattening adapter-specific evidence.\",\n      \"group\": \"core\",\n      \"status\": \"questioned\",\n      \"basis\": \"research\",\n      \"evidence\": [\n        {\n          \"ref\": \"../docs/environment-adapters.md\",\n          \"label\": \"Observation envelope proposal\",\n          \"kind\": \"research\"\n        },\n        {\n          \"ref\": \"../docs/consumer-differential-lab.md\",\n          \"label\": \"Semantic differential premise\",\n          \"kind\": \"research\"\n        }\n      ]\n    },\n    {\n      \"id\": \"semantic-diff\",\n      \"kind\": \"component\",\n      \"label\": \"Semantic differential\",\n      \"description\": \"Compares what different consumers expose or preserve without declaring one universal truth.\",\n      \"group\": \"core\",\n      \"status\": \"established\",\n      \"basis\": \"human-declared\",\n      \"evidence\": [\n        {\n          \"ref\": \"../docs/consumer-differential-lab.md\",\n          \"label\": \"Consumer Differential Lab\",\n          \"kind\": \"research\"\n        }\n      ]\n    },\n    {\n      \"id\": \"notebook\",\n      \"kind\": \"component\",\n      \"label\": \"Lab notebook\",\n      \"description\": \"Separates question, hypothesis, observation, tool result, conclusion and unresolved next question.\",\n      \"group\": \"core\",\n      \"status\": \"established\",\n      \"basis\": \"human-declared\",\n      \"evidence\": [\n        {\n          \"ref\": \"../docs/lab-experience.md\",\n          \"label\": \"Lab notebook\",\n          \"kind\": \"human\"\n        }\n      ]\n    },\n    {\n      \"id\": \"raw-ooxml\",\n      \"kind\": \"instrument\",\n      \"label\": \"Raw OOXML\",\n      \"description\": \"Ground-level ZIP/package evidence: parts, relationships, XML, hashes and flags.\",\n      \"group\": \"instruments\",\n      \"status\": \"established\",\n      \"basis\": \"human-declared\",\n      \"evidence\": [\n        {\n          \"ref\": \"../docs/environment-adapters.md\",\n          \"label\": \"Environment 1 — raw package\",\n          \"kind\": \"human\"\n        }\n      ]\n    },\n    {\n      \"id\": \"excel-parser\",\n      \"kind\": \"instrument\",\n      \"label\": \"excel-parser\",\n      \"description\": \"Candidate rich machine interpretation for formulas, styles, tables, charts and dependency graph.\",\n      \"group\": \"instruments\",\n      \"status\": \"candidate\",\n      \"basis\": \"research\",\n      \"evidence\": [\n        {\n          \"ref\": \"../research/reuse-map.md\",\n          \"label\": \"Reuse assessment\",\n          \"kind\": \"research\"\n        }\n      ]\n    },\n    {\n      \"id\": \"native-excel\",\n      \"kind\": \"instrument\",\n      \"label\": \"Excel native\",\n      \"description\": \"Future Office.js / Microsoft Graph observations from Microsoft's workbook model.\",\n      \"group\": \"instruments\",\n      \"status\": \"candidate\",\n      \"basis\": \"research\",\n      \"evidence\": [\n        {\n          \"ref\": \"../docs/environment-adapters.md\",\n          \"label\": \"Excel native probes\",\n          \"kind\": \"research\"\n        }\n      ]\n    },\n    {\n      \"id\": \"other-consumers\",\n      \"kind\": \"instrument\",\n      \"label\": \"Other consumers\",\n      \"description\": \"LibreOffice, Google conversion, LLM ingestion and later consumers remain replaceable adapters.\",\n      \"group\": \"instruments\",\n      \"status\": \"candidate\",\n      \"basis\": \"research\",\n      \"evidence\": [\n        {\n          \"ref\": \"../docs/environment-adapters.md\",\n          \"label\": \"Environment roadmap\",\n          \"kind\": \"research\"\n        }\n      ]\n    }\n  ],\n  \"edges\": [\n    {\n      \"from\": \"web-ui\",\n      \"to\": \"experiment\",\n      \"kind\": \"operates\",\n      \"label\": \"investigates through\",\n      \"status\": \"established\",\n      \"basis\": \"human-declared\"\n    },\n    {\n      \"from\": \"experiment\",\n      \"to\": \"specimen\",\n      \"kind\": \"uses\",\n      \"status\": \"established\",\n      \"basis\": \"human-declared\"\n    },\n    {\n      \"from\": \"experiment\",\n      \"to\": \"adapter-registry\",\n      \"kind\": \"invokes\",\n      \"status\": \"candidate\",\n      \"basis\": \"research\"\n    },\n    {\n      \"from\": \"adapter-registry\",\n      \"to\": \"raw-ooxml\",\n      \"kind\": \"routes_to\",\n      \"status\": \"candidate\",\n      \"basis\": \"research\"\n    },\n    {\n      \"from\": \"adapter-registry\",\n      \"to\": \"excel-parser\",\n      \"kind\": \"routes_to\",\n      \"status\": \"candidate\",\n      \"basis\": \"research\"\n    },\n    {\n      \"from\": \"adapter-registry\",\n      \"to\": \"native-excel\",\n      \"kind\": \"routes_to\",\n      \"status\": \"candidate\",\n      \"basis\": \"research\"\n    },\n    {\n      \"from\": \"adapter-registry\",\n      \"to\": \"other-consumers\",\n      \"kind\": \"routes_to\",\n      \"status\": \"candidate\",\n      \"basis\": \"research\"\n    },\n    {\n      \"from\": \"raw-ooxml\",\n      \"to\": \"observation-envelope\",\n      \"kind\": \"produces\",\n      \"status\": \"questioned\",\n      \"basis\": \"research\"\n    },\n    {\n      \"from\": \"excel-parser\",\n      \"to\": \"observation-envelope\",\n      \"kind\": \"produces\",\n      \"status\": \"questioned\",\n      \"basis\": \"research\"\n    },\n    {\n      \"from\": \"native-excel\",\n      \"to\": \"observation-envelope\",\n      \"kind\": \"produces\",\n      \"status\": \"questioned\",\n      \"basis\": \"research\"\n    },\n    {\n      \"from\": \"other-consumers\",\n      \"to\": \"observation-envelope\",\n      \"kind\": \"produces\",\n      \"status\": \"questioned\",\n      \"basis\": \"research\"\n    },\n    {\n      \"from\": \"observation-envelope\",\n      \"to\": \"semantic-diff\",\n      \"kind\": \"compared_by\",\n      \"status\": \"candidate\",\n      \"basis\": \"research\"\n    },\n    {\n      \"from\": \"semantic-diff\",\n      \"to\": \"web-ui\",\n      \"kind\": \"projected_in\",\n      \"label\": \"light table\",\n      \"status\": \"established\",\n      \"basis\": \"human-declared\"\n    },\n    {\n      \"from\": \"experiment\",\n      \"to\": \"notebook\",\n      \"kind\": \"records\",\n      \"status\": \"established\",\n      \"basis\": \"human-declared\"\n    }\n  ],\n  \"views\": [\n    {\n      \"id\": \"product-flow\",\n      \"label\": \"Product flow\",\n      \"include\": [\n        \"web-ui\",\n        \"specimen\",\n        \"experiment\",\n        \"adapter-registry\",\n        \"observation-envelope\",\n        \"semantic-diff\",\n        \"notebook\"\n      ],\n      \"focus\": \"experience\"\n    },\n    {\n      \"id\": \"consumer-flow\",\n      \"label\": \"Consumer differential\",\n      \"include\": [\n        \"specimen\",\n        \"adapter-registry\",\n        \"raw-ooxml\",\n        \"excel-parser\",\n        \"native-excel\",\n        \"other-consumers\",\n        \"observation-envelope\",\n        \"semantic-diff\"\n      ],\n      \"focus\": \"data_flow\"\n    }\n  ]\n}\n"),selected=null,filter="all",activeView="",editing=false;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const byId=()=>Object.fromEntries(model.nodes.map(n=>[n.id,n]));
function visible(n){if(filter!=="all"&&(n.status||"candidate")!==filter)return false;if(!activeView)return true;const v=(model.views||[]).find(v=>v.id===activeView);return !v||!v.include?.length||v.include.includes(n.id)}
function render(){
 const groups=[...(model.groups||[])].sort((a,b)=>(a.order??99)-(b.order??99)||a.label.localeCompare(b.label));
 document.getElementById("groups").innerHTML=groups.map(g=>{
   const nodes=model.nodes.filter(n=>n.group===g.id&&visible(n));if(!nodes.length)return "";
   return '<section class="group"><h2>'+esc(g.label)+'</h2>'+nodes.map(n=>'<article class="node '+esc(n.status||"candidate")+(selected===n.id?" selected":"")+'" data-id="'+esc(n.id)+'"><span class="kind">'+esc(n.kind)+'</span><strong>'+esc(n.label)+'</strong><span class="pill">'+esc(n.status||"candidate")+'</span><span class="pill">'+esc(n.basis||"human-declared")+'</span></article>').join("")+'</section>';
 }).join("");
 document.querySelectorAll(".node").forEach(el=>el.onclick=()=>{selected=el.dataset.id;render();inspect()});
}
function inspect(){
 const el=document.getElementById("inspector"),n=byId()[selected];if(!n){el.textContent="Select a component to inspect its status, basis, evidence and relationships.";return}
 const edges=model.edges.filter(e=>e.from===n.id||e.to===n.id);
 const evidence=(n.evidence||[]).map(e=>'<li><a href="'+esc(e.ref)+'">'+esc(e.label||e.ref)+'</a> <span class="pill">'+esc(e.kind||"evidence")+'</span></li>').join("");
 const editor=editing?'<div class="editor"><label>Label</label><input id="e-label" value="'+esc(n.label)+'"><label>Description</label><textarea id="e-desc">'+esc(n.description||"")+'</textarea><label>Status</label><select id="e-status">'+["observed","established","candidate","questioned","deprecated"].map(x=>'<option '+(x===(n.status||"candidate")?"selected":"")+'>'+x+'</option>').join("")+'</select><label>Basis</label><select id="e-basis">'+["human-declared","repository-evidence","research","experiment","inference"].map(x=>'<option '+(x===(n.basis||"human-declared")?"selected":"")+'>'+x+'</option>').join("")+'</select><button id="apply" style="margin-top:10px">Apply semantic edit</button></div>':"";
 el.innerHTML='<h3>'+esc(n.label)+'</h3><dl><dt>Kind</dt><dd>'+esc(n.kind)+'</dd><dt>Status</dt><dd>'+esc(n.status||"candidate")+'</dd><dt>Basis</dt><dd>'+esc(n.basis||"human-declared")+'</dd><dt>Description</dt><dd>'+esc(n.description||"—")+'</dd><dt>Relationships</dt><dd><ul>'+edges.map(e=>'<li>'+esc(e.from===n.id?"→ ":"← ")+esc(e.kind)+' · '+esc(e.from===n.id?(byId()[e.to]?.label||e.to):(byId()[e.from]?.label||e.from))+'</li>').join("")+'</ul></dd><dt>Evidence</dt><dd><ul>'+(evidence||"<li>None linked</li>")+'</ul></dd></dl>'+editor;
 if(editing)document.getElementById("apply").onclick=()=>{n.label=document.getElementById("e-label").value;n.description=document.getElementById("e-desc").value;n.status=document.getElementById("e-status").value;n.basis=document.getElementById("e-basis").value;render();inspect()};
}
function boot(){
 (model.views||[]).forEach(v=>document.getElementById("view").insertAdjacentHTML("beforeend",'<option value="'+esc(v.id)+'">'+esc(v.label)+'</option>'));
 document.getElementById("view").onchange=e=>{activeView=e.target.value;render()};
 document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));render()});
 document.getElementById("edit").onclick=e=>{editing=!editing;e.target.classList.toggle("active",editing);e.target.textContent=editing?"Editing semantics":"Edit semantics";inspect()};
 document.getElementById("export").onclick=()=>{const blob=new Blob([JSON.stringify(model,null,2)+"\n"],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="system.json";a.click();URL.revokeObjectURL(a.href)};
 render();
}
boot();
</script>
</body>
</html>
