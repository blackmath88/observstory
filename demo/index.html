<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Observstory Demo Lab</title>
<meta name="description" content="One synthetic project at different moments, rendered by the real Observstory Project Map.">
<style>
:root{--bg:#f6f5f1;--surface:#fdfcfa;--ink:#1d1d1f;--ink2:#515154;--ink3:#8a8a8e;--hair:#e4e2dc;--hair2:#d6d4cd;
--accent:#b4530a;--select:#0a66d6;--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
--mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#161617;--surface:#1e1e20;--ink:#f2f2f4;--ink2:#b8b8bd;--ink3:#85858b;
--hair:#2e2e31;--hair2:#3a3a3e;--accent:#f09a45;--select:#4c9bff}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 var(--sans);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:underline;text-decoration-color:var(--hair2);text-underline-offset:2px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--select);outline-offset:2px;border-radius:6px}
.bar{background:var(--surface);border-bottom:1px solid var(--hair);padding:10px 20px 10px}
.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:600;font-size:13px;white-space:nowrap}
.brand span{color:var(--ink3);font-weight:500}
.synthetic{font-size:11px;color:var(--ink2);border:1px solid var(--hair2);border-radius:999px;padding:1px 8px;white-space:nowrap}
.tabs{display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.act{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:0 4px 0 10px;white-space:nowrap}
.act:first-child{margin-left:0}
[role=tab]{padding:4px 10px;border-radius:7px;color:var(--ink2);white-space:nowrap}
[role=tab]:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
[role=tab][aria-selected=true]{background:var(--ink);color:var(--surface)}
.nav{display:flex;gap:6px;margin-left:auto}
.nav button{border:1px solid var(--hair2);border-radius:7px;padding:3px 10px;color:var(--ink2);background:var(--surface)}
.nav button:disabled{opacity:.35;cursor:default}
.story{display:flex;align-items:center;gap:6px 14px;margin-top:8px}
.words{margin:0;flex:1;min-width:0}
.step{font:11px var(--mono);color:var(--ink3);white-space:nowrap}
.caption{font-size:14px;color:var(--ink);margin-right:8px}
.hint{color:var(--ink3)}
iframe{flex:1;width:100%;border:0;background:var(--bg);min-height:480px}
.foot{padding:6px 20px;border-top:1px solid var(--hair);color:var(--ink3);font-size:11.5px;background:var(--surface)}
@media (max-width:760px){.bar{padding:10px 14px}.caption{font-size:13.5px}.tabs{flex-basis:100%}
  .story{flex-wrap:wrap}.words{flex-basis:100%;order:2}.step{order:1}.nav{order:1}.foot{display:none}}
</style>
</head>
<body>
<header class="bar">
  <div class="row">
    <span class="brand">Observstory <span>Demo Lab</span></span>
    <span class="synthetic" title="northstar/chat-app, northstar/recsys and northstar/voice-notes are invented; so are Alice, Ben, Sofia and Dana">Synthetic data</span>
    <nav class="tabs" role="tablist" aria-label="Project states"><span class="act">One week</span><button type="button" role="tab" id="tab-quiet" aria-controls="stage" data-i="0">Quiet</button><button type="button" role="tab" id="tab-parallel" aria-controls="stage" data-i="1">Parallel</button><button type="button" role="tab" id="tab-overlap" aria-controls="stage" data-i="2">Overlap</button><button type="button" role="tab" id="tab-crowded" aria-controls="stage" data-i="3">Crowded</button><button type="button" role="tab" id="tab-resolved" aria-controls="stage" data-i="4">Resolved</button><button type="button" role="tab" id="tab-calm" aria-controls="stage" data-i="5">Calm again</button><span class="act">Moments</span><button type="button" role="tab" id="tab-burst" aria-controls="stage" data-i="6">Agent burst</button><button type="button" role="tab" id="tab-stale" aria-controls="stage" data-i="7">Stale</button><span class="act">Another project</span><button type="button" role="tab" id="tab-other-project" aria-controls="stage" data-i="8">Other project</button><span class="act">Declared vs observed</span><button type="button" role="tab" id="tab-kickoff" aria-controls="stage" data-i="9">Kickoff</button><button type="button" role="tab" id="tab-saturday-morning" aria-controls="stage" data-i="10">Sat 09:30</button><button type="button" role="tab" id="tab-after-core-freeze" aria-controls="stage" data-i="11">Sat 15:00</button><button type="button" role="tab" id="tab-feature-freeze" aria-controls="stage" data-i="12">Sat 23:00</button></nav>
  </div>
  <div class="story">
    <span class="step" id="step"></span>
    <p class="words" aria-live="polite"><span class="caption" id="caption"></span> <span class="hint" id="hint"></span></p>
    <div class="nav"><button type="button" id="prev" aria-label="Previous state">← Prev</button>
      <button type="button" id="next" aria-label="Next state">Next →</button></div>
  </div>
</header>
<iframe id="stage" title="Project Map" src="states/quiet.html"></iframe>
<p class="foot">Every state is synthetic observation data run through the real pipeline: derive → snapshot → scene compiler → Project Map.
  Each map links to its own <code>scene.json</code> and <code>snapshot.json</code>. ← → to step through.</p>
<script type="application/json" id="states">[{"id": "quiet", "tab": "Quiet", "act": "story", "caption": "Monday morning at Northstar. Recent work has landed and nothing is in flight.", "hint": "This is what calm looks like: lanes, and what changed recently.", "repo": "northstar/chat-app", "when": "2026-09-14T08:00:00Z", "status": "0 in flight · 0 overlaps · 0 waiting · 0 stale"}, {"id": "parallel", "tab": "Parallel", "act": "story", "caption": "Alice, Ben and Sofia each open a pull request, in three different areas.", "hint": "Parallel work is normal, so nothing asks for attention.", "repo": "northstar/chat-app", "when": "2026-09-14T17:00:00Z", "status": "3 in flight · 0 overlaps · 0 waiting · 0 stale"}, {"id": "overlap", "tab": "Overlap", "act": "story", "caption": "Sofia starts chat history on a branch, with no pull request yet. Her change and Alice's both touch store.py.", "hint": "Click the orange connector to see the evidence.", "repo": "northstar/chat-app", "when": "2026-09-15T11:00:00Z", "status": "3 in flight · 1 overlap · 0 waiting · 0 stale"}, {"id": "crowded", "tab": "Crowded", "act": "story", "caption": "Sofia opens her pull request, and Ben's agent-assisted refactor rewrites store.py too. Three changes, one file.", "hint": "Ben's export works in the same area but no shared file, so it gets no connector.", "repo": "northstar/chat-app", "when": "2026-09-15T16:00:00Z", "status": "5 in flight · 3 overlaps · 0 waiting · 0 stale"}, {"id": "resolved", "tab": "Resolved", "act": "story", "caption": "They talk. Sofia turns to evaluating Alice's work; Ben stacks his refactor on Alice's branch.", "hint": "The overlap is gone. Grey arrows now show what waits on what.", "repo": "northstar/chat-app", "when": "2026-09-16T14:00:00Z", "status": "4 in flight · 0 overlaps · 2 waiting · 0 stale"}, {"id": "calm", "tab": "Calm again", "act": "story", "caption": "Alice's memory work and Ben's refactor land. The evaluation carries on by itself.", "hint": "Quiet again, one day later.", "repo": "northstar/chat-app", "when": "2026-09-18T10:00:00Z", "status": "2 in flight · 0 overlaps · 0 waiting · 0 stale"}, {"id": "burst", "tab": "Agent burst", "act": "moments", "caption": "Sofia's coding agent generates the settings screens: 24 commits in under an hour, one pull request.", "hint": "≋ marks a machine-paced stream. It stays in the background.", "repo": "northstar/chat-app", "when": "2026-09-18T14:00:00Z", "status": "3 in flight · 0 overlaps · 0 waiting · 0 stale"}, {"id": "stale", "tab": "Stale", "act": "moments", "caption": "A week later, a search spike without a pull request and a parked draft have gone quiet.", "hint": "Open loops show up as work to revisit, with no judgement of anyone.", "repo": "northstar/chat-app", "when": "2026-09-21T11:00:00Z", "status": "3 in flight · 0 overlaps · 0 waiting · 2 stale"}, {"id": "other-project", "tab": "Other project", "act": "shape", "caption": "A different Northstar project with its own lanes: Data, Pipeline, Model, Eval, API, Docs.", "hint": "Same renderer; the lanes come from the project's configuration.", "repo": "northstar/recsys", "when": "2026-09-15T14:00:00Z", "status": "4 in flight · 1 overlap · 1 waiting · 0 stale"}, {"id": "kickoff", "tab": "Kickoff", "act": "declared", "caption": "A 36-hour hackathon. At kickoff the team agrees gates and who does what; Alice confirms the notes.", "hint": "The rail shows what people declared. Diamonds are commitments; none has linked work yet.", "repo": "northstar/voice-notes", "when": "2026-10-02T19:00:00Z", "status": "0 in flight · 0 overlaps · 0 waiting · 0 stale"}, {"id": "saturday-morning", "tab": "Sat 09:30", "act": "declared", "caption": "Alice's audio pipeline has landed; Ben and Sofia are in flight. The morning check-in adds a commitment for #12.", "hint": "Commitment states come from the repository, not from anyone updating a status.", "repo": "northstar/voice-notes", "when": "2026-10-03T09:30:00Z", "status": "2 in flight · 0 overlaps · 0 waiting · 0 stale"}, {"id": "after-core-freeze", "tab": "Sat 15:00", "act": "declared", "caption": "The core API freeze was at 12:00. The core API still changed afterwards, and the evaluation set has not started.", "hint": "Two cues under Declared vs observed. Click the orange gate on the rail for both sides.", "repo": "northstar/voice-notes", "when": "2026-10-03T15:00:00Z", "status": "2 in flight · 1 overlap · 0 waiting · 0 stale"}, {"id": "feature-freeze", "tab": "Sat 23:00", "act": "declared", "caption": "The feature freeze has passed while the recorder UI is still open. The evening notes are proposed, not confirmed.", "hint": "Unconfirmed notes never reach the rail; they wait for a named person.", "repo": "northstar/voice-notes", "when": "2026-10-03T23:00:00Z", "status": "2 in flight · 0 overlaps · 0 waiting · 0 stale"}]</script>
<script>
(function(){
const S = JSON.parse(document.getElementById('states').textContent);
const tabs = [...document.querySelectorAll('[role=tab]')], stage = document.getElementById('stage');
let cur = -1;
function show(i, push){
  i = Math.max(0, Math.min(S.length - 1, i)); if (i === cur) return; cur = i; const st = S[i];
  tabs.forEach((t, k) => { t.setAttribute('aria-selected', k === i); t.tabIndex = k === i ? 0 : -1; });
  tabs[i].scrollIntoView({block: 'nearest', inline: 'nearest'});
  stage.src = 'states/' + st.id + '.html';
  document.getElementById('step').textContent = (i + 1) + ' / ' + S.length;
  document.getElementById('caption').textContent = st.caption;
  document.getElementById('hint').textContent = st.hint;
  document.getElementById('prev').disabled = i === 0; document.getElementById('next').disabled = i === S.length - 1;
  document.title = 'Observstory Demo Lab · ' + st.tab;
  if (push !== false) history.replaceState(null, '', '#' + st.id);
}
tabs.forEach(t => t.addEventListener('click', () => show(+t.dataset.i)));
document.getElementById('prev').addEventListener('click', () => show(cur - 1));
document.getElementById('next').addEventListener('click', () => show(cur + 1));
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); show(cur + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); show(cur - 1); }
});
function fromHash(){ const k = S.findIndex(s => '#' + s.id === location.hash); show(k < 0 ? 0 : k, false); }
window.addEventListener('hashchange', fromHash);
fromHash();
})();
</script>
</body>
</html>
