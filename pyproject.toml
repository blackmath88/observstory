[project]
name = "observstory"
version = "0.2.0.dev0"
description = "Observstory: evidence-backed repository observation, Project Knowledge and Project Memory (stdlib only)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
observstory = "observstory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/observstory"]
