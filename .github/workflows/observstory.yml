name: Dogfood Observstory

# Events are the primary trigger; the hourly cron (off the :00 peak) only reconciles (ADR-009).
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, closed, ready_for_review, converted_to_draft]
  issues:
    types: [opened, closed, reopened]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: observstory
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests and signal experiments
        run: python3 -m unittest discover -s tests -t . -v

  snapshot:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Observstory
        id: observstory
        uses: ./

      - name: Agent query smoke test
        run: python3 scripts/observstory.py query open-loops --snapshot "${{ steps.observstory.outputs.snapshot }}" | head -40

      - name: Upload control center
        uses: actions/upload-artifact@v4
        with:
          name: observstory-${{ github.run_id }}
          path: observstory
          retention-days: 7
