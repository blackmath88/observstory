name: Observstory
description: Typed, evidence-backed state of in-flight work (overlap, open loops) for humans and coding agents.
author: blackmath88
branding:
  icon: radio
  color: orange

inputs:
  github-token:
    description: Token used to read repository activity. Defaults to the workflow token.
    required: false
    default: ${{ github.token }}
  config:
    description: Optional path to observstory.config.json. Missing file means zero-config defaults.
    required: false
    default: observstory.config.json
  coordination:
    description: Optional declared collaboration state (gates, commitments, decisions from check-ins). Missing file means no mission rail.
    required: false
    default: .observstory/coordination.json
  knowledge:
    description: Optional Project Knowledge manifest path (e.g. .observstory/knowledge.json). Empty disables it. Needs a checkout containing the built commit; fetch-depth 0 enables changes against the first parent.
    required: false
    default: ""
  output:
    description: Output directory for index.html (Project Map), radar.html and data/{snapshot,scene,observations}.json.
    required: false
    default: observstory
  frontend:
    description: >-
      Which page becomes index.html. "classic" (default) keeps the Python-rendered Project Map.
      "observatory" uses the prebuilt static frontend (frontend/release, ADR-038) and moves the
      classic map to map.html, where it stays reachable and works offline.
    required: false
    default: classic

outputs:
  snapshot:
    description: Path to the generated snapshot.json
    value: ${{ steps.build.outputs.snapshot }}
  overlaps:
    description: Number of overlap signals
    value: ${{ steps.build.outputs.overlaps }}

runs:
  using: composite
  steps:
    - name: Build project snapshot and dashboard
      id: build
      shell: bash
      env:
        OBSERVSTORY_TOKEN: ${{ inputs.github-token }}
        OBSERVSTORY_REPOSITORY: ${{ github.repository }}
        OBSERVSTORY_API_URL: ${{ github.api_url }}
        OBSERVSTORY_SHA: ${{ github.sha }}
        OBSERVSTORY_REF: ${{ github.ref }}
        OBSERVSTORY_EVENT: ${{ github.event_name }}
        OBSERVSTORY_RUN_ID: ${{ github.run_id }}
        OBSERVSTORY_CONFIG: ${{ inputs.config }}
        OBSERVSTORY_OUTPUT: ${{ inputs.output }}
        OBSERVSTORY_COORDINATION: ${{ inputs.coordination }}
        OBSERVSTORY_KNOWLEDGE: ${{ inputs.knowledge }}
        OBSERVSTORY_FRONTEND: ${{ inputs.frontend }}
      run: |
        python3 "$GITHUB_ACTION_PATH/scripts/observstory.py" build
        case "$OBSERVSTORY_FRONTEND" in
          classic) ;;
          observatory)
            release="$GITHUB_ACTION_PATH/frontend/release"
            if [ ! -f "$release/index.html" ]; then
              echo "::error::frontend: observatory needs $release/index.html (run npm run release in frontend/)"
              exit 1
            fi
            mv "$OBSERVSTORY_OUTPUT/index.html" "$OBSERVSTORY_OUTPUT/map.html"
            cp "$release/index.html" "$OBSERVSTORY_OUTPUT/index.html"
            cp -R "$release/assets" "$OBSERVSTORY_OUTPUT/assets"
            echo "Observatory frontend installed; classic map at map.html"
            ;;
          *)
            echo "::error::unknown frontend '$OBSERVSTORY_FRONTEND' (use classic or observatory)"
            exit 1
            ;;
        esac
        echo "snapshot=$OBSERVSTORY_OUTPUT/data/snapshot.json" >> "$GITHUB_OUTPUT"
        python3 -c "import json,sys; print('overlaps=%d' % json.load(open(sys.argv[1]))['summary']['signals']['overlap'])" \
          "$OBSERVSTORY_OUTPUT/data/snapshot.json" >> "$GITHUB_OUTPUT"

