/* tokens.css */
/* Observatory design tokens — PROPOSAL (pixel-design study, 31 Oct 2026).
 *
 * Status: study tokens, not shipping tokens. Final palette waits for the owner's
 * templates (see RECOMMENDATION.md → "Decisions awaiting templates").
 *
 * Inherited laws (docs/development/ui-language.md, docs/ui/design-language.md):
 *   - one accent, reserved for "a conversation is needed";
 *   - selection and focus use a separate cool colour, never the accent;
 *   - confidence is shape (dash), not colour;
 *   - no traffic-light red/amber/green.
 *
 * New in this study:
 *   - the accent is the observatory's warm window: it is lit only when the
 *     loaded snapshot carries an overlap / waiting signal or a declared-vs-observed cue;
 *   - scenery colours (--px-*) are a separate, closed palette used only by pixel art;
 *     UI never reads them and pixel art never uses UI text colours.
 */

:root {
  color-scheme: dark;

  /* ── Night (default for the study) ─────────────────────────────── */
  --sky-0: #0a0e15;   /* page, deepest sky */
  --sky-1: #10161f;   /* panels: sidebar, inspector */
  --sky-2: #151d28;   /* raised: hover, header */
  --sky-3: #1c2633;   /* active row, input */
  --hair: #222c39;    /* 1px separators */
  --hair-2: #2e3a4a;  /* stronger separator, graticule */

  --ink: #e4e7ea;     /* primary text  (≈14.9:1 on --sky-1) */
  --ink-2: #a2abb5;   /* secondary     (≈7.6:1) */
  --ink-3: #6f7a87;   /* tertiary, ages, rule lines (≈4.1:1 — never for body copy) */

  --mark: #8db5c9;    /* neutral data mark: a work item in flight (existing dark token) */
  --mark-dim: #57707e;/* stale / landed marks (receding, not hidden) */
  --select: #78aaf5;  /* selection, focus ring, telescope reticle */
  --select-t: #16243a;/* selected row background */
  --accent: #f09a45;  /* conversation needed — the lit window (existing dark token) */
  --accent-t: #2b1d10;/* accent wash behind attention rows */
  --wire: #8d97a3;    /* waiting connectors (directed) */
  --declared: #c9b8e8;/* declared coordination text marker (rail only; not a signal colour) */
  --decor: #2f3b4d;   /* decorative stars drawn in UI surfaces (atlas): never mistaken for data */

  /* ── Pixel scenery palette (closed set; art only) ───────────────── */
  --px-void: #070a10;
  --px-sky-hi: #0d1420;
  --px-sky-lo: #142032;
  --px-star-decor: #3d4b60;   /* decorative stars: deliberately low contrast, 1 art px */
  --px-star-faint: #2a3546;
  --px-hill-far: #121a26;
  --px-hill-near: #0c121b;
  --px-stone: #3a4556;
  --px-stone-hi: #56637a;
  --px-dome: #8492a3;
  --px-dome-hi: #b6c0cc;
  --px-dome-lo: #5b6779;
  --px-slit: #05080c;
  --px-window-off: #2a2219;   /* unlit window: warm but dark */
  --px-window-on: var(--accent);
  --px-glow: rgba(240, 154, 69, 0.18);
  --px-brass: #9a8a6a;        /* telescope fittings (study B) */
  --px-tube: #c9d1da;

  /* ── Type ───────────────────────────────────────────────────────── */
  --font-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Inter", "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --fs-xs: 11px;   /* rule lines, ages, coordinates */
  --fs-sm: 12px;   /* labels, lane caps, mono refs */
  --fs-md: 13px;   /* body rows (GitHub density) */
  --fs-lg: 15px;   /* inspector title */
  --lh: 1.45;
  --caps-track: 0.08em;

  /* ── Space & shape ──────────────────────────────────────────────── */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  --radius: 6px;          /* rows, pills, inputs */
  --radius-panel: 8px;    /* floating inspector only */
  --row-h: 32px;
  --bar-h: 36px;

  /* ── Pixel scale: 1 art pixel = N CSS px, integer only ──────────── */
  --px-scale: 3;          /* desktop; 2 under 768px */

  /* ── Motion ─────────────────────────────────────────────────────── */
  --t-fast: 120ms;
  --t-turn: 600ms;        /* telescope turn, stepped in 8 art-angle steps */
  --ease: cubic-bezier(.2, .7, .2, 1);
}

/* Paper — a light variant so the existing light-primary map rules stay reachable.
 * Night is the study default because the scenery is a night sky. */
:root[data-theme="paper"] {
  color-scheme: light;
  --sky-0: #efeee9; --sky-1: #f8f7f3; --sky-2: #f2f1ec; --sky-3: #e8e6df;
  --hair: #dedbd3; --hair-2: #cfccc3;
  --ink: #1c1d1f; --ink-2: #4f5357; --ink-3: #6e7175;
  --mark: #2f5467; --mark-dim: #8a9aa3; --select: #0a66d6; --select-t: #e3edfb;
  --accent: #b4530a; --accent-t: #fbefe4; --wire: #6e6e73; --declared: #5b4a85;
  --decor: #d9d6cd;
}

@media (max-width: 767px) {
  :root { --px-scale: 2; }
}
</style>
<style>
/* src/study.css */
/* Observatory pixel-design study — layout and components.
 * Colour comes only from tokens.css. */

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--sky-0);
  color: var(--ink);
  font: var(--fs-md)/var(--lh) var(--font-ui);
  -webkit-font-smoothing: antialiased;
}
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--select); outline-offset: 1px; border-radius: 3px; }
.mono { font-family: var(--font-mono); font-size: var(--fs-sm); }
.caps { text-transform: uppercase; letter-spacing: var(--caps-track); font-size: var(--fs-xs); color: var(--ink-3); font-weight: 600; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
canvas.px { image-rendering: pixelated; display: block; }

/* ── Study chrome (not product UI) ─────────────────────────────── */
.study-bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s4);
  padding: var(--s2) var(--s4); border-bottom: 1px solid var(--hair);
  background: repeating-linear-gradient(135deg, var(--sky-1) 0 6px, var(--sky-0) 6px 12px);
}
.study-bar h1 { font-size: var(--fs-md); margin: 0; font-weight: 600; }
.study-bar .notice { color: var(--ink-2); font-size: var(--fs-sm); }
.seg { display: inline-flex; border: 1px solid var(--hair-2); border-radius: var(--radius); overflow: hidden; background: var(--sky-1); }
.seg button { border: 0; background: none; padding: 3px 10px; cursor: pointer; font-size: var(--fs-sm); color: var(--ink-2); border-right: 1px solid var(--hair); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--sky-3); color: var(--ink); box-shadow: inset 0 -2px 0 var(--select); }
.seg-label { font-size: var(--fs-xs); color: var(--ink-3); margin-right: 4px; }
.ctl { display: inline-flex; align-items: center; }
.spacer { flex: 1; }

/* ── App frame ─────────────────────────────────────────────────── */
.app {
  margin: var(--s4); border: 1px solid var(--hair-2); border-radius: var(--radius-panel);
  overflow: hidden; background: var(--sky-1);
  display: grid; grid-template-rows: var(--bar-h) auto 1fr 26px; min-height: 640px;
}
.titlebar {
  display: flex; align-items: center; gap: var(--s3); padding: 0 var(--s3);
  background: var(--sky-2); border-bottom: 1px solid var(--hair); min-width: 0;
}
.wordmark { display: flex; align-items: center; gap: 6px; font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
.wordmark canvas { width: 18px; height: 18px; }
.titlebar .repo { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.titlebar .status { margin-left: auto; color: var(--ink-2); font-size: var(--fs-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.titlebar .status b { color: var(--ink); font-weight: 600; }
.titlebar .status .acc { color: var(--accent); }
.horizon { height: 0; }
.horizon canvas { width: auto; }
.horizon { background: var(--px-sky-hi); }
.app[data-study="a"] .horizon { height: auto; border-bottom: 1px solid var(--hair); }

.body { display: grid; grid-template-columns: 248px minmax(0, 1fr) 320px; min-height: 0; }
.side { border-right: 1px solid var(--hair); display: flex; flex-direction: column; min-height: 0; background: var(--sky-1); }
.mainpane { min-width: 0; background: var(--sky-0); overflow: auto; position: relative; }
.rail { border-left: 1px solid var(--hair); overflow: auto; background: var(--sky-1); }

.statusbar {
  display: flex; gap: var(--s4); align-items: center; padding: 0 var(--s3);
  border-top: 1px solid var(--hair); background: var(--sky-2); font-size: var(--fs-xs); color: var(--ink-2);
  white-space: nowrap; overflow: hidden;
}
.statusbar .dot { display: inline-block; width: 6px; height: 6px; margin-right: 6px; vertical-align: 1px; background: var(--ink-3); }
.statusbar .dot.on { background: var(--accent); }
.statusbar .dot.sel { background: var(--select); }

/* ── Sidebar ───────────────────────────────────────────────────── */
.side-section { padding: var(--s3) var(--s3) var(--s2); }
.side-section + .side-section { border-top: 1px solid var(--hair); }
.navlist { list-style: none; margin: 6px 0 0; padding: 0; }
.navlist button {
  width: 100%; display: flex; align-items: center; gap: 8px; border: 0; background: none; text-align: left;
  padding: 4px 6px; border-radius: var(--radius); cursor: pointer; color: var(--ink-2);
}
.navlist button:hover { background: var(--sky-2); color: var(--ink); }
.navlist button[aria-current="true"] { background: var(--sky-3); color: var(--ink); }
.navlist .count { margin-left: auto; font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--ink-3); }
.navlist .sub button { padding-left: 22px; font-family: var(--font-mono); font-size: var(--fs-sm); }
.scene { position: relative; margin-top: auto; border-top: 1px solid var(--hair); }
.scene canvas { width: auto; }
.scene { background: var(--px-hill-near); }
.scene .caption { font-size: var(--fs-xs); color: var(--ink-2); padding: 6px var(--s3) 8px; border-top: 1px solid var(--hair); }
.instrument { position: relative; border-bottom: 1px solid var(--hair); background: var(--px-void); }
.instrument canvas { width: auto; }
.instrument .stage { width: max-content; margin: 0 auto; }
.instrument .lane-tag { position: absolute; font-size: 10px; letter-spacing: var(--caps-track); text-transform: uppercase; color: var(--ink-3); transform: translate(-50%, -50%); pointer-events: none; }
.instrument .lane-tag.on { color: var(--select); font-weight: 700; }
.instrument .readout { font-size: var(--fs-xs); color: var(--ink-2); font-family: var(--font-mono); padding: 6px var(--s3); border-top: 1px solid var(--hair); background: var(--sky-1); }
.instrument .stage { position: relative; }

/* ── Main: shared ──────────────────────────────────────────────── */
.pane-head { display: flex; align-items: baseline; gap: var(--s3); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--hair); background: var(--sky-1); position: sticky; top: 0; z-index: 2; }
.pane-head h2 { font-size: var(--fs-md); margin: 0; font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: var(--s3); margin-left: auto; font-size: var(--fs-xs); color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.glyph { display: inline-block; vertical-align: middle; flex: none; }
.empty { padding: var(--s5) var(--s4); color: var(--ink-2); }

/* Board (study A map) */
.board { display: grid; grid-template-columns: repeat(4, minmax(170px, 1fr)); gap: 0; min-height: 100%; }
.lane { border-right: 1px solid var(--hair); padding: var(--s3); min-width: 0; }
.lane:last-child { border-right: 0; }
.lane-head { margin-bottom: var(--s2); }
.lane-head .desc { font-size: var(--fs-xs); color: var(--ink-3); }
.lane.quiet .lane-head .caps::after { content: " · quiet"; font-weight: 400; }
.group { border: 1px solid var(--hair); border-radius: var(--radius); background: var(--sky-1); margin-bottom: var(--s2); }
.group-head { display: flex; justify-content: space-between; padding: 5px 8px; border-bottom: 1px solid var(--hair); font-family: var(--font-mono); font-size: var(--fs-sm); color: var(--ink-2); }
.group.attn { border-color: color-mix(in srgb, var(--accent) 55%, var(--hair)); }
.also { padding: 4px 8px; font-size: var(--fs-xs); color: var(--ink-3); border-top: 1px dashed var(--hair); }

/* Work-item row (board, list, field label) */
.row {
  display: grid; grid-template-columns: 14px auto 1fr auto; align-items: center; gap: 8px;
  width: 100%; min-height: var(--row-h); padding: 4px 8px; border: 0; border-left: 2px solid transparent;
  background: none; text-align: left; cursor: pointer; color: var(--ink);
}
.row + .row { border-top: 1px solid var(--hair); }
.row:hover { background: var(--sky-2); }
.row[aria-pressed="true"] { background: var(--select-t); border-left-color: var(--select); }
.row .ref { font-family: var(--font-mono); font-size: var(--fs-sm); color: var(--ink-2); white-space: nowrap; }
.row .label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .age { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--ink-3); white-space: nowrap; }
.row .pills { grid-column: 3 / 5; display: flex; gap: 4px; flex-wrap: wrap; }
.row.stale, .row.draft { opacity: .62; }
.dimmed .row:not(.related):not([aria-pressed="true"]), .dimmed .fnode:not(.related):not(.sel), .dimmed .astar:not(.related):not(.sel) { opacity: .35; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-xs); padding: 0 6px; border-radius: 99px; border: 1px solid var(--hair-2); color: var(--ink-2); line-height: 18px; white-space: nowrap; }
.pill.overlap { border-color: var(--accent); color: var(--accent); background: var(--accent-t); }
.pill.waiting { border-style: dashed; border-color: var(--wire); }
.pill.stale { border-style: dotted; }

.board .row { grid-template-columns: 14px minmax(0, 1fr) auto; row-gap: 2px; align-items: center; }
.board .row > .glyph { grid-area: 1 / 1; }
.board .row .ref { grid-area: 1 / 2; font-size: var(--fs-xs); overflow: hidden; text-overflow: ellipsis; }
.board .row .age { grid-area: 1 / 3; }
.board .row .label { grid-area: 2 / 2 / 3 / 4; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.board .row .pills { grid-area: 3 / 2 / 4 / 4; }

/* List (all studies) */
.list-group { border-bottom: 1px solid var(--hair); }
.list-group h3 { margin: 0; padding: 8px var(--s4) 4px; }
.list .row { padding-left: var(--s4); padding-right: var(--s4); grid-template-columns: 14px 56px 84px 128px minmax(0,1fr) auto auto; }
.app:not([data-study="b"]) .list .row { grid-template-columns: 14px 0 84px 128px minmax(0,1fr) auto auto; column-gap: 8px; }
.list .row .coord { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--ink-3); }
.list .row .area { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .row .pills { grid-column: auto; }

/* Field (study B map): recency scale */
.field { position: relative; padding: var(--s3) var(--s4) var(--s5); }
.field svg { width: 100%; height: auto; display: block; overflow: visible; }
.fnode { cursor: pointer; }
.fnode text { font-family: var(--font-mono); font-size: 11px; fill: var(--ink-2); }
.fnode.sel text { fill: var(--ink); font-weight: 700; }
.fnode:focus { outline: none; }
.fnode:focus-visible .ring { stroke: var(--select); stroke-width: 2; }

/* Atlas (study C map) */
.atlas { padding: var(--s3); position: relative; }
.cartouche { position: absolute; right: 28px; bottom: 26px; display: flex; gap: 10px; align-items: flex-end; font-size: 11px; color: var(--ink-2); text-align: right; }
.atlas svg { width: 100%; height: auto; display: block; background: var(--sky-0); }
.astar { cursor: pointer; }
.astar:focus { outline: none; }
.astar:focus-visible .ring, .astar.sel .ring { stroke: var(--select); stroke-width: 1.5; }
.astar text, .cluster text { font-family: var(--font-mono); font-size: 11px; }
.halo { paint-order: stroke; stroke: var(--sky-0); stroke-width: 4px; stroke-linejoin: round; }

/* Replay */
.replay { padding: var(--s3) var(--s4) var(--s5); display: grid; gap: var(--s3); }
.feeds { display: grid; gap: 4px; }
.feed { display: grid; grid-template-columns: 16px 220px 1fr; gap: 8px; align-items: baseline; font-size: var(--fs-sm); padding: 4px 8px; border: 1px solid var(--hair); border-radius: var(--radius); background: var(--sky-1); }
.feed.off { color: var(--ink-3); border-style: dashed; }
.transport { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); padding: var(--s2); border: 1px solid var(--hair); border-radius: var(--radius); background: var(--sky-1); }
.transport button, .transport select { background: var(--sky-3); border: 1px solid var(--hair-2); border-radius: var(--radius); padding: 2px 10px; cursor: pointer; }
.transport input[type=range] { flex: 1; min-width: 160px; accent-color: var(--select); }
.ticks { position: relative; height: 10px; margin: -4px 8px 0; }
.ticks i { position: absolute; top: 0; width: 1px; height: 6px; background: var(--hair-2); }
.ticks i.add { height: 8px; background: var(--mark-dim); }
.ticks i.remove { height: 8px; background: var(--ink-3); }
.ticks i.cur { background: var(--select); height: 10px; width: 2px; }
.event-card { border: 1px solid var(--hair); border-left: 2px solid var(--select); border-radius: var(--radius); padding: var(--s2) var(--s3); background: var(--sky-1); }
.event-card .meta { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--ink-3); }
table.areas { border-collapse: collapse; width: 100%; font-size: var(--fs-sm); }
table.areas th, table.areas td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--hair); }
table.areas th { font-weight: 600; color: var(--ink-3); font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: var(--caps-track); }
table.areas td.n { font-family: var(--font-mono); text-align: right; }
table.areas tr.cur td { background: var(--select-t); }
.note { font-size: var(--fs-sm); color: var(--ink-2); border-left: 2px solid var(--hair-2); padding: 2px 10px; }

/* ── Rail: attention, declared, collection, inspector ──────────── */
.rail section { padding: var(--s3); border-bottom: 1px solid var(--hair); }
.rail h2 { margin: 0 0 6px; }
.attn-item { display: grid; grid-template-columns: 12px 1fr; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 6px; border-radius: var(--radius); cursor: pointer; color: var(--ink); }
.attn-item:hover { background: var(--sky-2); }
.attn-item[aria-pressed="true"] { background: var(--select-t); }
.attn-item .rule { display: block; font-size: var(--fs-xs); color: var(--ink-3); }
.attn-item .conf { font-family: var(--font-mono); }
.attn-item.overlap .lbl, .attn-item.waiting .lbl { color: var(--ink); }
.attn-item.overlap { box-shadow: inset 2px 0 0 var(--accent); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: var(--fs-sm); margin: 0; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; }
.kv dd.skipped { color: var(--accent); }
.degraded { margin-top: 6px; font-size: var(--fs-xs); color: var(--ink-2); border: 1px dashed var(--hair-2); border-radius: var(--radius); padding: 4px 6px; }
.declared-item { font-size: var(--fs-sm); padding: 4px 0; }
.declared-item .tag { font-size: var(--fs-xs); color: var(--declared); border: 1px solid var(--declared); border-radius: 3px; padding: 0 4px; margin-right: 4px; }

.inspector { background: var(--sky-2); }
.inspector header { display: flex; align-items: flex-start; gap: 8px; }
.inspector h3 { margin: 0; font-size: var(--fs-lg); line-height: 1.3; }
.inspector .close { margin-left: auto; background: none; border: 1px solid var(--hair-2); border-radius: var(--radius); padding: 0 8px; cursor: pointer; color: var(--ink-2); }
.inspector .basis { font-size: var(--fs-xs); color: var(--ink-2); margin: 4px 0 8px; }
.inspector ul.ev { list-style: none; padding: 0; margin: 6px 0; }
.inspector ul.ev li { padding: 4px 0; border-top: 1px solid var(--hair); font-size: var(--fs-sm); }
.inspector .rule { font-size: var(--fs-xs); color: var(--ink-3); font-family: var(--font-mono); margin-top: 8px; }
.inspector .src { margin-top: 8px; font-size: var(--fs-xs); color: var(--ink-3); }
.inspector blockquote { margin: 6px 0; padding: 4px 8px; border-left: 2px solid var(--wire); color: var(--ink-2); font-family: var(--font-mono); font-size: var(--fs-xs); }
.eyepiece { position: relative; width: 168px; margin: 0 auto 8px; }
.eyepiece canvas { width: 168px; height: 168px; }
.eyepiece .tag { position: absolute; font-family: var(--font-mono); font-size: 10px; color: var(--ink); background: var(--px-void); padding: 0 3px; transform: translate(-50%, 0); white-space: nowrap; }

/* ── Notes & asset sheet below the app ─────────────────────────── */
.notes { margin: 0 var(--s4) var(--s6); display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--s4); }
.card { border: 1px solid var(--hair); border-radius: var(--radius-panel); background: var(--sky-1); padding: var(--s3) var(--s4); }
.card h2 { font-size: var(--fs-md); margin: 0 0 6px; }
.card p, .card li { color: var(--ink-2); }
.card table { border-collapse: collapse; width: 100%; font-size: var(--fs-sm); }
.card td, .card th { padding: 4px 6px; border-top: 1px solid var(--hair); vertical-align: top; text-align: left; }
.card th { color: var(--ink-3); font-weight: 600; }
.sheet { display: flex; flex-wrap: wrap; gap: var(--s3); align-items: flex-end; }
.sheet figure { margin: 0; font-size: var(--fs-xs); color: var(--ink-3); }
.sheet canvas { background: var(--px-void); border: 1px solid var(--hair); }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 4px; font-size: var(--fs-xs); }
.swatches span { display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); color: var(--ink-2); }
.swatches i { width: 14px; height: 14px; border: 1px solid var(--hair-2); flex: none; }

/* ── Responsive ────────────────────────────────────────────────── */
@media (max-width: 1100px) {
  .body { grid-template-columns: 220px minmax(0, 1fr); }
  .rail { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--hair); }
}
@media (max-width: 767px) {
  .app { margin: 0; border-radius: 0; border-left: 0; border-right: 0; }
  .study-bar { padding: var(--s2); }
  .study-bar .notice { flex-basis: 100%; }
  .body { grid-template-columns: 1fr; }
  .side { border-right: 0; border-bottom: 1px solid var(--hair); }
  .side .lanes-nav { display: none; }
  .titlebar .status { display: none; }
  .board { grid-template-columns: 1fr; }
  .lane { border-right: 0; border-bottom: 1px solid var(--hair); }
  .list .row, .app:not([data-study="b"]) .list .row { grid-template-columns: 14px auto 1fr auto; }
  .list .row .pills { grid-column: 2 / -1; grid-row: 2; }
  .list .row .age { grid-row: 1; grid-column: 4; }
  .list .row .coord, .list .row .area { display: none; }
  .feed { grid-template-columns: 16px 1fr; }
  .feed .d { grid-column: 2; }
  .inspector.open {
    position: fixed; left: 0; right: 0; bottom: 0; max-height: 72vh; overflow: auto; z-index: 10;
    border-top: 2px solid var(--select); box-shadow: 0 -12px 32px rgba(0,0,0,.5);
  }
  .statusbar .hide-sm { display: none; }
  .atlas { overflow-x: auto; }
  .atlas svg { min-width: 760px; }
  .cartouche { position: static; justify-content: flex-end; margin-top: 8px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

<body>
<header id="studybar" class="study-bar" aria-label="Study controls"></header>
<main id="app" class="app" aria-label="Observatory (study)">
  <div id="titlebar" class="titlebar"></div>
  <div id="horizon" class="horizon" aria-hidden="true"></div>
  <div class="body">
    <nav id="side" class="side" aria-label="Views and areas"></nav>
    <section id="main" class="mainpane" aria-label="Work"></section>
    <aside id="rail" class="rail" aria-label="Attention, collection and inspector"></aside>
  </div>
  <footer id="statusbar" class="statusbar"></footer>
</main>
<section id="notes" class="notes" aria-label="Study notes"></section>
<noscript><p style="padding:16px">This study page renders with JavaScript (no network access needed).</p></noscript>
<script>
/* src/pixels.js */
/* Observatory pixel kit — deterministic, procedural, dependency-free.
 *
 * Editable source of every pixel asset in the study. The same functions draw
 * to <canvas> in the study page and to SVG files in build.mjs, so the
 * exported assets in assets/ are byte-for-byte reproducible.
 *
 * Model: a PixelBuffer is a w×h grid of palette *names* (strings). Drawing
 * functions only write names; colours are resolved at render time from
 * PALETTE (or from matching --px-* CSS custom properties in the page).
 *
 * Rules enforced here (see README → "Pixel rules"):
 *   - integer scale only; one art pixel is never split or anti-aliased;
 *   - scenery uses the closed --px-* palette; the only shared colour is the
 *     accent, and it appears only as the lit window (state, not decoration);
 *   - decorative stars are 1 art px and dim; data stars use STAR_GLYPHS (5×5)
 *     and are drawn by the UI layer, never by scenery;
 *   - everything random is seeded (mulberry32), so a seed always yields the
 *     same picture.
 */
(function (root) {
  "use strict";

  const PALETTE = {
    "void": "#070a10",
    "sky-hi": "#0d1420",
    "sky-lo": "#142032",
    "star-decor": "#3d4b60",
    "star-faint": "#2a3546",
    "hill-far": "#121a26",
    "hill-near": "#0c121b",
    "stone": "#3a4556",
    "stone-hi": "#56637a",
    "stone-lo": "#283140",
    "dome": "#8492a3",
    "dome-hi": "#b6c0cc",
    "dome-lo": "#5b6779",
    "slit": "#05080c",
    "window-off": "#2a2219",
    "window-on": "#f09a45",
    "glow": "#2e2116",
    "brass": "#9a8a6a",
    "tube": "#c9d1da",
    "tube-lo": "#8792a0",
    "leaf": "#101a1c",
    "leaf-hi": "#16252a",
    "mark": "#8db5c9",
    "mark-dim": "#57707e",
    "select": "#78aaf5",
    "accent": "#f09a45",
  };

  /* Lane → azimuth (degrees from zenith, negative = west/left).
   * Stable by lane order, never by activity: the telescope turning means
   * "you selected something in this lane", not "something happened here". */
  const AZIMUTH = { intent: -50, build: -18, verify: 18, ship: 50, other: 0 };
  const PARKED = 0;

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function hash(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h;
  }

  class PixelBuffer {
    constructor(w, h) {
      this.w = w;
      this.h = h;
      this.px = new Array(w * h).fill(null);
    }
    set(x, y, name) {
      x = Math.round(x); y = Math.round(y);
      if (x < 0 || y < 0 || x >= this.w || y >= this.h) return;
      this.px[y * this.w + x] = name;
    }
    get(x, y) {
      if (x < 0 || y < 0 || x >= this.w || y >= this.h) return null;
      return this.px[y * this.w + x];
    }
    rect(x, y, w, h, name) {
      for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.set(x + i, y + j, name);
    }
    /* Stamp a character grid. legend maps chars to palette names; '.' is transparent. */
    grid(x, y, rows, legend) {
      rows.forEach((row, j) => {
        [...row].forEach((ch, i) => {
          if (ch !== "." && legend[ch]) this.set(x + i, y + j, legend[ch]);
        });
      });
    }
  }

  /* ── Scenery ─────────────────────────────────────────────────────── */

  /* Night sky: two-tone ordered dither (no gradients) + seeded 1px decorative stars.
   * `quiet` is a list of {x,y,w,h} rects that must stay free of decorative stars
   * (labels, data, anything readable). */
  function sky(buf, seed, opts = {}) {
    const rnd = mulberry32(seed);
    const bayer = [0, 2, 3, 1];
    const split = opts.horizon ?? buf.h;
    for (let y = 0; y < buf.h; y++) {
      const t = y / Math.max(1, split);
      for (let x = 0; x < buf.w; x++) {
        const thr = (bayer[(x & 1) + 2 * (y & 1)] + 0.5) / 4;
        const m = (t - 0.62) / 0.22;                // dither only in a narrow band
        buf.set(x, y, opts.solid ? opts.solid : m >= 1 || (m > 0 && m > thr) ? "sky-lo" : "sky-hi");
      }
    }
    const density = opts.density ?? 0.012;
    const n = Math.round(buf.w * split * density);
    const quiet = opts.quiet || [];
    for (let i = 0; i < n; i++) {
      const x = Math.floor(rnd() * buf.w);
      const y = Math.floor(rnd() * split * 0.92);
      const bright = rnd() > 0.82;
      if (quiet.some((q) => x >= q.x && x < q.x + q.w && y >= q.y && y < q.y + q.h)) continue;
      buf.set(x, y, bright ? "star-decor" : "star-faint");
    }
  }

  /* Seeded 1-D value noise, smoothed — used for hill silhouettes. */
  function ridge(seed, w, base, amp, period) {
    const rnd = mulberry32(seed);
    const knots = [];
    for (let i = 0; i <= Math.ceil(w / period) + 1; i++) knots.push(rnd());
    const out = [];
    for (let x = 0; x < w; x++) {
      const k = x / period, i = Math.floor(k), f = k - i;
      const s = f * f * (3 - 2 * f);
      out.push(Math.round(base - amp * (knots[i] * (1 - s) + knots[i + 1] * s)));
    }
    return out;
  }

  function hills(buf, seed, groundY) {
    const far = ridge(seed, buf.w, groundY - 2, 9, 22);
    const near = ridge(seed + 7, buf.w, groundY + 1, 4, 13);
    for (let x = 0; x < buf.w; x++) {
      for (let y = far[x]; y < buf.h; y++) buf.set(x, y, "hill-far");
      for (let y = near[x]; y < buf.h; y++) buf.set(x, y, "hill-near");
    }
  }

  const TREE = [
    "...a...",
    "..aaa..",
    "..aAa..",
    ".aaaaa.",
    ".aAaaa.",
    "aaaaaAa",
    ".aaaaa.",
    "aaaAaaa",
    "...s...",
    "...s...",
  ];
  function tree(buf, x, groundY) {
    buf.grid(x, groundY - TREE.length, TREE, { a: "leaf", A: "leaf-hi", s: "stone-lo" });
  }

  /* The observatory: a stone house with a rotating dome.
   *   state.angle   telescope azimuth in degrees (−60…60); the dome slit rotates with it
   *   state.open    shutter open (something is selected) / closed (parked)
   *   state.lit     window lit = the loaded snapshot asks for a conversation
   * Returns anchor points so the UI can align labels. */
  function observatory(buf, x, groundY, state = {}) {
    const W = 26, H = 12, R = 12;
    const top = groundY - H;
    const cx = x + 13;
    const angle = quantize(state.angle ?? PARKED);
    const open = !!state.open;
    const lit = !!state.lit;

    // Glow first, so the house draws over it.
    if (lit) {
      for (let j = 0; j < 3; j++) {
        for (let i = -j; i < 4 + j; i++) {
          const gx = x + 5 + i, gy = groundY + j;
          if (buf.get(gx, gy) && (j < 2 || (gx + gy) % 2 === 0)) buf.set(gx, gy, "glow");
        }
      }
    }

    // House body with brick courses.
    for (let j = 0; j < H; j++) {
      for (let i = 0; i < W; i++) {
        let c = i > W - 8 ? "stone-lo" : "stone";
        if (j === 0) c = "stone-hi";
        else if (j % 4 === 0 && (i + (j % 8 === 0 ? 0 : 3)) % 6 !== 0) c = "stone-lo";
        buf.set(x + i, top + j, c);
      }
    }
    // Ledge under the dome.
    buf.rect(x - 1, top - 1, W + 2, 1, "stone-hi");

    // Dome (semicircle) with light from upper left.
    const base = top - 1;
    for (let dy = 0; dy <= R; dy++) {
      const half = Math.floor(Math.sqrt(R * R - dy * dy));
      for (let dx = -half; dx <= half; dx++) {
        const edge = Math.abs(dx) === half || dy === R;
        let c = "dome";
        if (dx < -half / 3 && dy > R / 3) c = "dome-hi";
        if (dx > half / 2) c = "dome-lo";
        if (edge) c = "dome-lo";
        buf.set(cx + dx, base - dy, c);
      }
    }

    // Slit: rotates with the telescope (projected onto the dome face).
    const slitX = Math.round(cx + Math.sin(rad(angle)) * R * 0.6);
    for (let dy = 1; dy <= R; dy++) {
      const half = Math.floor(Math.sqrt(R * R - dy * dy));
      for (let k = -1; k <= 1; k++) {
        const sx = slitX + k;
        if (Math.abs(sx - cx) > half - 1) continue;
        buf.set(sx, base - dy, open ? "slit" : (k === 0 ? "dome-lo" : buf.get(sx, base - dy)));
      }
    }

    // Telescope tube through the open slit.
    let tip = null;
    if (open) {
      const px = slitX, py = base - 3;
      tip = tube(buf, px, py, angle, 15, 2);
    }

    // Window (lit or not) and door.
    const wx = x + 5, wy = top + 3;
    buf.rect(wx - 1, wy - 1, 6, 7, "stone-lo");
    buf.rect(wx, wy, 4, 5, lit ? "window-on" : "window-off");
    buf.rect(wx + 2, wy, 1, 5, "stone-lo");
    buf.rect(wx, wy + 2, 4, 1, "stone-lo");
    buf.rect(x + 17, top + 4, 5, 8, "stone-lo");
    buf.rect(x + 18, top + 5, 3, 7, "slit");

    return { cx, base, slitX, tip, window: { x: wx, y: wy, w: 4, h: 5 }, door: { x: x + 17, y: top + 4 } };
  }

  /* A tube of given thickness along `angle` (deg from vertical) from (x,y). */
  function tube(buf, x, y, angle, len, thick) {
    const a = rad(angle);
    const ux = Math.sin(a), uy = -Math.cos(a);
    const nx = -uy, ny = ux;
    for (let t = 0; t <= len; t += 0.5) {
      for (let k = 0; k < thick; k++) {
        const px = x + ux * t + nx * (k - (thick - 1) / 2);
        const py = y + uy * t + ny * (k - (thick - 1) / 2);
        buf.set(px, py, k === 0 ? "tube" : "tube-lo");
      }
    }
    const tx = Math.round(x + ux * len), ty = Math.round(y + uy * len);
    buf.set(tx, ty, "brass");
    return { x: tx, y: ty };
  }

  /* Study B — a refractor on a German equatorial mount, for the instrument panel.
   * Counterweight sits on the declination axis (perpendicular to the tube). */
  function refractor(buf, x, groundY, state = {}) {
    const angle = quantize(state.angle ?? PARKED);
    const a = rad(angle);
    const ux = Math.sin(a), uy = -Math.cos(a);
    let nx = Math.cos(a), ny = Math.sin(a);
    if (ny < 0 || (ny === 0 && nx > 0)) { nx = -nx; ny = -ny; }   // n points downward
    // Pier, feet, mount head.
    buf.rect(x - 2, groundY - 14, 4, 14, "stone");
    buf.rect(x + 1, groundY - 14, 1, 14, "stone-lo");
    buf.rect(x - 6, groundY - 1, 12, 1, "stone-hi");
    buf.rect(x - 5, groundY, 10, 1, "stone-lo");
    buf.rect(x - 3, groundY - 18, 6, 4, "brass");
    buf.rect(x + 1, groundY - 18, 2, 4, "stone-lo");
    const px = x, py = groundY - 20;
    // Counterweight shaft and weight (down side).
    tube(buf, px, py, Math.atan2(nx, -ny) * 180 / Math.PI, 7, 1);
    buf.rect(Math.round(px + nx * 8) - 1, Math.round(py + ny * 8) - 1, 3, 3, "stone-hi");
    // Main tube, dew shield, finder (up side), eyepiece.
    tube(buf, px - ux * 6, py - uy * 6, angle, 24, 3);
    const tip = tube(buf, px + ux * 18, py + uy * 18, angle, 6, 5);
    tube(buf, px - nx * 3 + ux * 2, py - ny * 3 + uy * 2, angle, 7, 1);
    buf.rect(Math.round(px - ux * 7) - 1, Math.round(py - uy * 7) - 1, 2, 2, "brass");
    buf.rect(Math.round(px) - 1, Math.round(py) - 1, 2, 2, "brass");
    return { pivot: { x: px, y: py }, tip };
  }

  /* Graduated azimuth arc around a pivot. Ticks every 10°, long ticks at lane azimuths. */
  function arc(buf, cx, cy, r, laneIds) {
    for (let d = -70; d <= 70; d += 5) {
      const a = rad(d);
      const long = laneIds.some((id) => AZIMUTH[id] === d);
      const len = long ? 3 : d % 10 === 0 ? 1 : 0;
      for (let k = 0; k <= len; k++) {
        buf.set(cx + Math.sin(a) * (r + k), cy - Math.cos(a) * (r + k), long ? "stone-hi" : "stone");
      }
    }
  }

  /* Eyepiece field (study B inspector). Field stars are decorative and 1px;
   * data glyphs are added by the UI on top. */
  function eyepiece(buf, seed) {
    const cx = (buf.w - 1) / 2, cy = (buf.h - 1) / 2, r = Math.min(cx, cy);
    const rnd = mulberry32(seed);
    for (let y = 0; y < buf.h; y++) {
      for (let x = 0; x < buf.w; x++) {
        const d = Math.hypot(x - cx, y - cy);
        if (d <= r - 2) buf.set(x, y, "void");
        else if (d <= r) buf.set(x, y, "stone");
      }
    }
    for (let i = 0; i < 26; i++) {
      const x = Math.floor(rnd() * buf.w), y = Math.floor(rnd() * buf.h);
      if (buf.get(x, y) === "void" && Math.hypot(x - cx, y - cy) > 6) buf.set(x, y, "star-faint");
    }
    // Reticle: dashed crosshair with a gap at the centre.
    for (let t = 0; t < buf.w; t++) {
      if (Math.abs(t - cx) < 5 || t % 3 === 2) continue;
      if (buf.get(t, Math.round(cy)) === "void" || buf.get(t, Math.round(cy)) === "star-faint") buf.set(t, Math.round(cy), "stone");
      if (buf.get(Math.round(cx), t) === "void" || buf.get(Math.round(cx), t) === "star-faint") buf.set(Math.round(cx), t, "stone");
    }
  }

  /* ── Data glyphs (UI layer) ──────────────────────────────────────
   * 5×5, one per work-item status. Shape carries status so it survives
   * greyscale; colour only adds selection (select) or attention (accent). */
  const STAR_GLYPHS = {
    in_flight: ["..x..", "..x..", "xxXxx", "..x..", "..x.."],
    draft:     ["..x..", ".....", "x.X.x", ".....", "..x.."],
    stale:     [".....", "..x..", ".xXx.", "..x..", "....."],
    landed:    [".xxx.", "x...x", "x...x", "x...x", ".xxx."],
  };

  /* 9×9 icons. One-colour silhouettes; meaning is also always written in text. */
  const ICONS = {
    overlap:  [".........", ".xxx.....", "x...x....", "x..xxxx..", "x..x.x.x.", ".xxxx..x.", "...x...x.", "....xxx..", "........."],
    waiting:  [".........", "....x....", "....xx...", "xxxxxxx..", "....xx...", "....x....", ".........", "x.x.x.x..", "........."],
    stale:    [".........", "..xxxxx..", ".x.....x.", ".x..x..x.", ".x..xx.x.", ".x.....x.", "..xxxxx..", ".........", "........."],
    declared: [".........", ".xxxxxx..", ".x....x..", ".x.xx.x..", ".x....x..", ".x.xx.x..", ".x....x..", ".xxxxxx..", "........."],
    plate:    [".........", "xxxxxxxxx", "x.......x", "x..x....x", "x.xxx...x", "x..x..x.x", "x.......x", "xxxxxxxxx", "........."],
    dome:     [".........", "...xxx...", "..xx.xx..", ".xxx.xxx.", ".xxx.xxx.", "xxxxxxxxx", "x.x...x.x", "x.x...x.x", "xxxxxxxxx"],
  };

  function glyph(buf, x, y, rows, name, centerName) {
    rows.forEach((row, j) => [...row].forEach((ch, i) => {
      if (ch === "x") buf.set(x + i, y + j, name);
      if (ch === "X") buf.set(x + i, y + j, centerName || name);
    }));
  }

  /* ── Renderers ───────────────────────────────────────────────── */

  function resolve(name, overrides) {
    return (overrides && overrides[name]) || PALETTE[name] || "#ff00ff";
  }

  function toCanvas(canvas, buf, scale, overrides) {
    canvas.width = buf.w * scale;
    canvas.height = buf.h * scale;
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let y = 0; y < buf.h; y++) {
      for (let x = 0; x < buf.w; x++) {
        const n = buf.px[y * buf.w + x];
        if (!n) continue;
        ctx.fillStyle = resolve(n, overrides);
        ctx.fillRect(x * scale, y * scale, scale, scale);
      }
    }
  }

  /* SVG with horizontal run-length rects; shape-rendering keeps edges crisp. */
  function toSVG(buf, overrides, title) {
    const rects = [];
    for (let y = 0; y < buf.h; y++) {
      let x = 0;
      while (x < buf.w) {
        const n = buf.px[y * buf.w + x];
        let run = 1;
        while (x + run < buf.w && buf.px[y * buf.w + x + run] === n) run++;
        if (n) rects.push(`<rect x="${x}" y="${y}" width="${run}" height="1" fill="${resolve(n, overrides)}"/>`);
        x += run;
      }
    }
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${buf.w} ${buf.h}" width="${buf.w * 4}" height="${buf.h * 4}" shape-rendering="crispEdges">` +
      (title ? `<title>${title}</title>` : "") + rects.join("") + `</svg>\n`;
  }

  /* Read --px-* custom properties so tokens.css stays the single source of colour. */
  function paletteFromCSS(el) {
    if (typeof getComputedStyle === "undefined") return {};
    const cs = getComputedStyle(el || document.documentElement);
    const out = {};
    for (const k of Object.keys(PALETTE)) {
      const v = cs.getPropertyValue("--px-" + k).trim();
      if (v && !v.startsWith("var(")) out[k] = v;
    }
    const acc = cs.getPropertyValue("--accent").trim();
    if (acc) { out["window-on"] = acc; out.accent = acc; }
    for (const k of ["mark", "mark-dim", "select"]) {
      const v = cs.getPropertyValue("--" + k).trim();
      if (v) out[k] = v;
    }
    return out;
  }

  function rad(d) { return (d * Math.PI) / 180; }
  function quantize(d) { return Math.round(d / 5) * 5; }

  root.ObsPixels = {
    PALETTE, AZIMUTH, PARKED, STAR_GLYPHS, ICONS,
    PixelBuffer, mulberry32, hash,
    sky, hills, tree, observatory, refractor, arc, eyepiece, tube, glyph,
    toCanvas, toSVG, paletteFromCSS, quantize,
  };
})(typeof window !== "undefined" ? window : globalThis);

      h("span", { class: "wordmark" }, icon, "Observatory"),
      h("span", { class: "repo mono" }, D.PROJECT.repository),
      status);
  }

  /* ── pixel scenes ── */
  function drawScenes(angle) {
    const pal = P.paletteFromCSS();
    const tgt = target(), win = windowLit();
    const scale = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--px-scale"), 10) || 3;

    const hz = document.querySelector("#horizon canvas");
    if (hz) {
      const w = Math.max(40, Math.floor(hz.parentElement.clientWidth / scale));
      const b = new P.PixelBuffer(w, 12);
      P.sky(b, 31 + (motionOn() ? twinkle % 3 : 0), { horizon: 12, density: 0.03, solid: "sky-hi" });
      P.hills(b, 5, 13);
      P.toCanvas(hz, b, scale, pal);
    }

    const sc = document.querySelector("#courtyard canvas");
    if (sc) {
      const w = Math.max(60, Math.floor(sc.parentElement.clientWidth / scale));
      const H = window.innerWidth < 768 ? 46 : 66;
      const ground = H - 10;
      const b = new P.PixelBuffer(w, H);
      P.sky(b, 17, { horizon: ground - 6, density: 0.02, quiet: [{ x: 0, y: H - 12, w, h: 12 }] });
      P.hills(b, 3, ground - 2);
      b.rect(0, ground, w, H - ground, "hill-near");
      for (let x = 0; x < w; x += 4) b.set(x + (x % 8 ? 1 : 0), ground + 2, "stone-lo");
      P.tree(b, 6, ground);
      if (w > 70) P.tree(b, 15, ground + 1);
      P.observatory(b, w - 34, ground, { angle, open: tgt.open, lit: win.lit });
      P.toCanvas(sc, b, scale, pal);
      sc.parentElement.querySelector(".caption").textContent = `Telescope ${tgt.why}. ${cap(win.why)}.`;
    }

    const ins = document.querySelector("#instrument canvas");
    if (ins) {
      const w = 82, H = 70, cx = 41, groundY = 66;
      const b = new P.PixelBuffer(w, H);
      P.sky(b, 9, { horizon: H, density: 0.015, solid: "sky-hi", quiet: [{ x: 0, y: 0, w, h: 10 }] });
      b.rect(0, groundY + 1, w, H - groundY - 1, "hill-near");
      P.arc(b, cx, groundY - 20, 32, D.ZONES.map((z) => z.id));
      P.refractor(b, cx, groundY, { angle });
      P.toCanvas(ins, b, scale === 3 ? 3 : 2, pal);
      const box = ins.parentElement;
      box.querySelectorAll(".lane-tag").forEach((tag) => {
        const z = tag.dataset.zone, a = (P.AZIMUTH[z] * Math.PI) / 180;
        const px = cx + Math.sin(a) * 39, py = groundY - 20 - Math.cos(a) * 39;
        tag.style.left = (px / w) * 100 + "%";
        tag.style.top = (py / H) * 100 + "%";
        tag.classList.toggle("on", tgt.open && P.AZIMUTH[z] === tgt.angle);
      });
      box.parentElement.querySelector(".readout").textContent = tgt.open
        ? `AZ ${tgt.angle > 0 ? "+" : ""}${tgt.angle}° · ${tgt.why.replace(/^pointing at |^following replay event in /, "")}`
        : "AZ 0° · parked · nothing selected";
    }

    const cart = document.querySelector("#cartouche");
    if (cart) {
      const b = new P.PixelBuffer(44, 30);
      P.sky(b, 4, { horizon: 22, density: 0.03 });
      P.hills(b, 8, 26);
      b.rect(0, 26, 44, 4, "hill-near");
      P.observatory(b, 14, 26, { angle, open: tgt.open, lit: win.lit });
      P.toCanvas(cart, b, 2, pal);
    }

    const eye = document.querySelector("#eyepiece");
    if (eye) drawEyepiece(eye, pal);
  }
  const cap = (x) => x.charAt(0).toUpperCase() + x.slice(1);

  function turnTelescope() {
    const goal = P.quantize(target().angle);
    clearInterval(angleTimer);
    if (!motionOn() || goal === angleNow) { angleNow = goal; drawScenes(angleNow); return; }
    angleTimer = setInterval(() => {
      angleNow += Math.sign(goal - angleNow) * 5;
      drawScenes(angleNow);
      if (angleNow === goal) clearInterval(angleTimer);
    }, 70);
  }

  function drawEyepiece(box, pal) {
    const c = box.querySelector("canvas");
    const b = new P.PixelBuffer(56, 56);
    P.eyepiece(b, 13);
    box.querySelectorAll(".tag").forEach((t) => t.remove());
    const place = [];
    const n = nodeById(S.sel), e = edgeById(S.sel);
    if (n) {
      place.push({ node: n, x: 28, y: 28 });
      edgesOf(n.id).forEach((ed, i) => {
        const other = nodeById(ed.from === n.id ? ed.to : ed.from);
        const a = ((P.hash(other.id) % 360) * Math.PI) / 180 + i;
        place.push({ node: other, x: 28 + Math.round(Math.cos(a) * 15), y: 28 + Math.round(Math.sin(a) * 15), edge: ed });
      });
    } else if (e) {
      place.push({ node: nodeById(e.from), x: 20, y: 28 }, { node: nodeById(e.to), x: 36, y: 28 });
    } else if (S.sel && S.sel.startsWith("area:")) {
      snap().nodes.filter((x) => x.group === S.sel).forEach((x, i, arr) => {
        const a = (i / arr.length) * Math.PI * 2 - Math.PI / 2;
        place.push({ node: x, x: 28 + Math.round(Math.cos(a) * (arr.length > 1 ? 12 : 0)), y: 28 + Math.round(Math.sin(a) * (arr.length > 1 ? 12 : 0)) });
      });
    }
    place.forEach((p, i) => {
      const color = i === 0 && !e ? "select" : p.node.attention ? "accent" : "mark";
      P.glyph(b, p.x - 2, p.y - 2, P.STAR_GLYPHS[p.node.status], color, color);
      box.append(h("span", { class: "tag", style: `left:${((p.x + 0.5) / 56) * 100}%;top:${((p.y + 4) / 56) * 100}%` }, p.node.ref));
    });
    P.toCanvas(c, b, 3, pal);
  }

  /* ── sidebar ── */
  function renderSide() {
    const side = document.getElementById("side");
    const kids = [];
    if (S.study === "b") {
      kids.push(h("div", { id: "instrument", class: "instrument", "aria-hidden": "true" },
        h("div", { class: "stage" }, h("canvas", { class: "px" }),
          D.ZONES.map((z) => h("span", { class: "lane-tag", "data-zone": z.id }, z.label))),
        h("div", { class: "readout" })));
    }
    const views = [["map", "Map"], ["list", "List"], ["replay", "Replay"]];
    kids.push(h("div", { class: "side-section" },
      h("div", { class: "caps" }, "Views"),
      h("ul", { class: "navlist" }, views.map(([v, label]) => h("li", null, h("button", {
        type: "button", "data-key": `nav:${v}`,
        "aria-current": String(v === "replay" ? S.state === "replay" : S.state !== "replay" && S.view === v),
        on: { click: () => { if (v === "replay") setState("replay"); else { if (S.state === "replay") setState("overlap"); S.view = v; render(); } } },
      }, iconSVG(v === "replay" ? "plate" : v === "map" ? "dome" : "declared", "var(--ink-3)"), label))))));

    const lanes = h("div", { class: "side-section lanes-nav" }, h("div", { class: "caps" }, S.state === "replay" ? "Areas · files at this event" : "Lanes · areas"));
    const ul = h("ul", { class: "navlist" });
    const rp = S.state === "replay" ? D.replayAt(S.pos) : null;
    D.ZONES.forEach((z) => {
      const nodes = rp ? [] : snap().nodes.filter((n) => zoneOfGroup(n.group) === z.id);
      ul.append(h("li", null, h("div", { class: "caps", style: "padding:6px 6px 2px" }, z.label,
        rp ? "" : h("span", { class: "count", style: "float:right" }, nodes.length ? `${nodes.length} item${nodes.length > 1 ? "s" : ""}` : "quiet"))));
      D.GROUPS.filter((g) => g.zone === z.id).forEach((g) => {
        const cnt = rp ? `${rp.files[g.path]} files` : (snap().nodes.filter((n) => n.group === g.id).length || "");
        ul.append(h("li", { class: "sub" }, h("button", {
          type: "button", "data-key": `area:${g.id}`, "aria-current": String(S.sel === g.id),
          disabled: !!rp, on: { click: (ev) => select(g.id, ev.currentTarget) },
        }, g.path, h("span", { class: "count" }, cnt))));
      });
    });
    lanes.append(ul);
    kids.push(lanes);

    if (S.study === "a") {
      kids.push(h("div", { id: "courtyard", class: "scene" }, h("canvas", { class: "px", "aria-hidden": "true" }), h("div", { class: "caption", "aria-live": "polite" })));
    }
    side.replaceChildren(...kids);

    const hz = document.getElementById("horizon");
    hz.replaceChildren(S.study === "a" ? h("canvas", { class: "px", "aria-hidden": "true" }) : "");
  }

  /* ── main pane ── */
  function renderMain() {
    const m = document.getElementById("main");
    const rel = relatedIds();
    m.classList.toggle("dimmed", !!rel);
    if (S.state === "replay") { m.replaceChildren(...replayPane()); return; }
    const head = h("div", { class: "pane-head" },
      h("h2", null, S.view === "list" ? "All work items" : { a: "Project map", b: "Recency field", c: "Atlas" }[S.study]),
      h("span", { class: "faint" }, S.view === "list" ? "full equivalent of the map, keyboard ↑↓ Enter Esc" : { a: "lanes → areas → work items", b: "distance from the right edge = time since last activity", c: "stable sky regions per lane; stars are work items" }[S.study]),
      legend());
    let body;
    if (S.view === "list") body = listView(rel);
    else if (S.study === "a") body = boardView(rel);
    else if (S.study === "b") body = fieldView(rel);
    else body = atlasView(rel, null);
    m.replaceChildren(head, body);
  }

  function legend() {
    return h("span", { class: "legend", "aria-hidden": "true" },
      h("span", null, glyphSVG("in_flight"), "in flight"),
      h("span", null, glyphSVG("draft"), "draft"),
      h("span", null, glyphSVG("stale"), "stale"),
      h("span", null, s("svg", { width: 22, height: 6 }, s("line", { x1: 0, y1: 3, x2: 22, y2: 3, stroke: "var(--accent)", "stroke-width": 1.5, "stroke-dasharray": "4 3" })), "overlap (derived)"),
      h("span", null, s("svg", { width: 22, height: 6 }, s("line", { x1: 0, y1: 3, x2: 18, y2: 3, stroke: "var(--wire)", "stroke-width": 1.3 }), s("path", { d: "M17 0 L22 3 L17 6 Z", fill: "var(--wire)" })), "waits on"));
  }

  function rowFor(n, rel, opts = {}) {
    const edges = edgesOf(n.id);
    const pills = edges.map((e) => {
      const other = nodeById(e.from === n.id ? e.to : e.from);
      if (e.type === "overlap") return h("span", { class: "pill overlap" }, `overlap · ${other.ref}`);
      return h("span", { class: "pill waiting" }, e.from === n.id ? `waits on ${other.ref}` : `${other.ref} waits on this`);
    });
    if (n.status === "stale") pills.push(h("span", { class: "pill stale" }, `idle ${age(n.age_hours)}${n.flags.includes("no_pull_request") ? " · no PR" : ""}`));
    const cls = ["row", n.status, rel && rel.has(n.id) ? "related" : ""].join(" ");
    const kids = opts.list
      ? [glyphSVG(n.status, { attn: n.attention, sel: S.sel === n.id }), h("span", { class: "ref" }, n.ref), h("span", { class: "area" }, groupById(n.group).path),
         h("span", { class: "label" }, n.label), h("span", { class: "pills" }, pills), h("span", { class: "age" }, age(n.age_hours))]
      : [glyphSVG(n.status, { attn: n.attention, sel: S.sel === n.id }), h("span", { class: "ref" }, n.ref), h("span", { class: "label" }, n.label), h("span", { class: "age" }, age(n.age_hours)),
         pills.length ? h("span", { class: "pills" }, pills) : null];
    return h("button", {
      type: "button", class: cls, "data-sel": "", "data-key": `${opts.list ? "lrow" : "row"}:${n.id}`,
      "aria-pressed": String(S.sel === n.id),
      "aria-label": `${n.ref} ${n.label}, ${STATUS_WORD[n.status]}, ${groupById(n.group).path}, last activity ${age(n.age_hours)} ago${edges.length ? ", " + edges.length + " relationship" + (edges.length > 1 ? "s" : "") : ""}`,
      on: { click: (ev) => select(n.id, ev.currentTarget) },
    }, kids);
  }

  function boardView(rel) {
    const st = snap();
    return h("div", { class: "board" }, D.ZONES.map((z) => {
      const groups = D.GROUPS.filter((g) => g.zone === z.id);
      const shown = groups.filter((g) => st.nodes.some((n) => n.group === g.id || n.also_touches.includes(g.id)));
      const lane = h("div", { class: "lane" + (shown.length ? "" : " quiet") },
        h("div", { class: "lane-head" }, h("div", { class: "caps" }, z.label), h("div", { class: "desc" }, z.description)));
      if (!shown.length) lane.append(h("p", { class: "faint", style: "font-size:12px;margin:4px 0" }, "Nothing in flight."));
      shown.forEach((g) => {
        const nodes = st.nodes.filter((n) => n.group === g.id);
        const also = st.nodes.filter((n) => n.also_touches.includes(g.id));
        const attn = nodes.some((n) => n.attention) && st.edges.some((e) => e.type === "overlap" && e.areas.includes(g.path));
        lane.append(h("div", { class: "group" + (attn ? " attn" : "") },
          h("div", { class: "group-head" }, h("span", null, g.path), h("span", null, attn ? iconSVG("overlap", "var(--accent)") : "")),
          nodes.map((n) => rowFor(n, rel)),
          also.length ? h("div", { class: "also" }, "also changed by ", also.map((n) => n.ref).join(", ")) : null));
      });
      return lane;
    }));
  }

  function listView(rel) {
    const st = snap();
    return h("div", { class: "list" }, D.ZONES.map((z) => {
      const nodes = st.nodes.filter((n) => zoneOfGroup(n.group) === z.id);
      return h("div", { class: "list-group" },
        h("h3", { class: "caps" }, `${z.label} · ${nodes.length ? nodes.length + " item" + (nodes.length > 1 ? "s" : "") : "quiet"}`),
        nodes.length ? nodes.map((n) => {
          const r = rowFor(n, rel, { list: true });
          if (S.study === "b") r.querySelector(".ref").before(h("span", { class: "coord" }, coord(n)));
          else r.querySelector(".ref").before(h("span", { class: "coord" }, ""));
          return r;
        }) : h("p", { class: "faint", style: "margin:0;padding:0 16px 8px;font-size:12px" }, "Nothing in flight."));
    }));
  }

  /* Study B map: recency field. x = √(age/48h) from the right edge; rows = areas. */
  function fieldView(rel) {
    const st = snap();
    const W = 900, L = 150, R = 860;
    const rows = [];
    D.ZONES.forEach((z) => D.GROUPS.filter((g) => g.zone === z.id).forEach((g) => rows.push({ z, g })));
    const H = 40 + rows.length * 46 + 20;
    const xOf = (hrs) => R - Math.sqrt(Math.min(hrs, 48) / 48) * (R - L);
    const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, role: "group", "aria-label": "Recency field: work items by area and time since last activity" });
    // scale
    [0, 1, 3, 6, 12, 24, 48].forEach((t) => {
      const x = xOf(t);
      svg.append(s("line", { x1: x, y1: 28, x2: x, y2: H - 16, stroke: "var(--hair)", "stroke-width": 1 }),
        s("text", { x, y: 18, "text-anchor": "middle", fill: "var(--ink-3)", "font-size": 11, "font-family": "var(--font-mono)" }, t === 0 ? "now" : `${t}h`));
    });
    svg.append(s("text", { x: L - 8, y: 18, "text-anchor": "end", fill: "var(--ink-3)", "font-size": 11 }, "window edge →"));
    const pos = {};
    rows.forEach(({ z, g }, i) => {
      const y = 50 + i * 46;
      const first = i === 0 || rows[i - 1].z !== z;
      if (first) svg.append(s("text", { x: 4, y: y - 14, fill: "var(--ink-3)", "font-size": 10, "font-weight": 700, "letter-spacing": "0.08em" }, z.label.toUpperCase()));
      svg.append(s("line", { x1: L, y1: y, x2: R, y2: y, stroke: "var(--hair)", "stroke-dasharray": "1 5" }),
        s("text", { x: 14, y: y + 4, fill: "var(--ink-2)", "font-size": 11, "font-family": "var(--font-mono)" }, g.path));
      st.nodes.filter((n) => n.group === g.id).forEach((n, k) => { pos[n.id] = { x: n.age_hours > 48 ? L - 18 : xOf(n.age_hours), y, k, n }; });
    });
    st.edges.forEach((e) => {
      const a = pos[e.from], b = pos[e.to];
      if (!a || !b) return;
      const on = !rel || rel.has(e.id);
      const midY = Math.min(a.y, b.y) - 18 - Math.abs(a.y - b.y) * 0.2;
      const d = `M${a.x} ${a.y} Q${(a.x + b.x) / 2 + 30} ${midY} ${b.x} ${b.y}`;
      svg.append(s("path", {
        d, fill: "none", stroke: e.type === "overlap" ? "var(--accent)" : "var(--wire)", "stroke-width": e.type === "overlap" ? 1.6 : 1.3,
        "stroke-dasharray": e.type === "overlap" ? "5 3" : null, opacity: on ? 1 : 0.3, "marker-end": e.directed ? "url(#arrow)" : null,
      }));
    });
    svg.prepend(s("defs", null, s("marker", { id: "arrow", viewBox: "0 0 6 6", refX: 9, refY: 3, markerWidth: 6, markerHeight: 6, orient: "auto-start-reverse" }, s("path", { d: "M0 0 L6 3 L0 6 Z", fill: "var(--wire)" }))));
    Object.values(pos).forEach(({ x, y, k, n }) => {
      const g = s("g", {
        class: "fnode" + (S.sel === n.id ? " sel" : "") + (rel && rel.has(n.id) ? " related" : ""), tabindex: 0, role: "button", "data-sel": "", "data-key": `f:${n.id}`,
        "aria-pressed": String(S.sel === n.id), "aria-label": `${n.ref} ${n.label}, ${STATUS_WORD[n.status]}, ${age(n.age_hours)} ago`,
        transform: `translate(${x} ${y})`, opacity: n.status === "stale" || n.status === "draft" ? 0.62 : null,
        on: { click: (ev) => select(n.id, ev.currentTarget), keydown: (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(n.id, ev.currentTarget); } } },
      });
      g.append(s("rect", { class: "ring", x: -9, y: -9, width: 18, height: 18, fill: "var(--sky-0)", stroke: S.sel === n.id ? "var(--select)" : "transparent" }));
      const gl = glyphSVG(n.status, { attn: n.attention, sel: S.sel === n.id, u: 3 });
      gl.setAttribute("x", -7.5); gl.setAttribute("y", -7.5);
      g.append(gl);
      const up = k % 2 === 1, left = x > W * 0.62;
      g.append(s("text", { x: left ? -12 : 12, y: up ? -9 : 16, "text-anchor": left ? "end" : "start", class: "halo" }, `${n.ref} ${n.label.length > 26 ? n.label.slice(0, 25) + "…" : n.label}`));
      if (n.age_hours > 48) g.append(s("text", { x: -6, y: 20, "font-size": 10, fill: "var(--ink-3)" }, `${age(n.age_hours)} ←`));
      svg.append(g);
    });
    return h("div", { class: "field" }, svg);
  }

  /* Study C map: atlas. Stable regions per lane, clusters per area, stars per item. */
  function atlasLayout(st) {
    const W = 960, top = 54, bottom = 450, colW = 225, x0 = 30;
    const clusters = {};
    D.ZONES.forEach((z, zi) => {
      const gs = D.GROUPS.filter((g) => g.zone === z.id);
      gs.forEach((g, gi) => {
        const slotH = (bottom - top) / gs.length;
        const j = (P.hash(g.id) % 40) - 20;
        clusters[g.id] = { x: x0 + zi * colW + colW / 2 + j, y: top + slotH * (gi + 0.5) + 6, g, z };
      });
    });
    const stars = {};
    if (st) Object.values(clusters).forEach((c) => {
      const ns = st.nodes.filter((n) => n.group === c.g.id);
      const placed = [];
      ns.forEach((n) => {
        let a = (P.hash(n.id) % 12) * 30;
        let p;
        for (let tries = 0; tries < 12; tries++, a += 30) {
          const r = ns.length === 1 ? 0 : 24;
          p = { x: c.x + Math.cos((a * Math.PI) / 180) * r, y: c.y - 6 + Math.sin((a * Math.PI) / 180) * r * 0.7 };
          if (placed.every((q) => Math.hypot(q.x - p.x, q.y - p.y) > 26)) break;
        }
        placed.push(p);
        stars[n.id] = Object.assign(p, { n });
      });
    });
    return { W, H: 600, top, bottom, colW, x0, clusters, stars };
  }

  function atlasView(rel, replay) {
    const st = replay ? null : snap();
    const L = atlasLayout(st);
    const svg = s("svg", { viewBox: `0 0 ${L.W} ${L.H}`, role: "group", "aria-label": replay ? "Atlas: files per area at this replay event" : "Atlas: work items as stars grouped by area and lane" });
    svg.append(s("defs", null, s("marker", { id: "aarrow", viewBox: "0 0 6 6", refX: 10, refY: 3, markerWidth: 7, markerHeight: 7, orient: "auto" }, s("path", { d: "M0 0 L6 3 L0 6 Z", fill: "var(--wire)" }))));
    // decorative stars: margins and gutters only, never near clusters or labels
    const rnd = P.mulberry32(77);
    for (let i = 0; i < 160; i++) {
      const x = rnd() * L.W, y = rnd() * 470;
      if (Object.values(L.clusters).some((c) => Math.hypot(c.x - x, c.y - y) < 70) || y < 44) continue;
      svg.append(s("rect", { x: Math.round(x), y: Math.round(y), width: 1.5, height: 1.5, fill: "var(--decor)", opacity: rnd() > 0.8 ? 1 : 0.6, "aria-hidden": "true" }));
    }
    // graticule and lane regions
    for (let gx = L.x0; gx <= L.x0 + 4 * L.colW; gx += L.colW / 3) svg.append(s("line", { x1: gx, y1: L.top - 10, x2: gx, y2: L.bottom + 10, stroke: "var(--hair)", "stroke-width": 0.6, "stroke-dasharray": "1 6" }));
    for (let gy = L.top; gy <= L.bottom; gy += 66) svg.append(s("line", { x1: L.x0, y1: gy, x2: L.x0 + 4 * L.colW, y2: gy, stroke: "var(--hair)", "stroke-width": 0.6, "stroke-dasharray": "1 6" }));
    D.ZONES.forEach((z, zi) => {
      const x = L.x0 + zi * L.colW;
      svg.append(s("rect", { x: x + 0.5, y: L.top - 24, width: L.colW - 1, height: L.bottom - L.top + 36, fill: "none", stroke: "var(--hair-2)", "stroke-dasharray": "2 3" }),

        fig("eyepiece field", 56, 56, (b) => { P.eyepiece(b, 13); P.glyph(b, 26, 26, P.STAR_GLYPHS.in_flight, "select", "select"); }, 2),
        ...Object.keys(P.STAR_GLYPHS).map((k) => fig(`star · ${k}`, 7, 7, (b) => P.glyph(b, 1, 1, P.STAR_GLYPHS[k], "mark", k === "in_flight" ? "accent" : "mark"), 5)),
        ...Object.keys(P.ICONS).map((k) => fig(`icon · ${k}`, 11, 11, (b) => P.glyph(b, 1, 1, P.ICONS[k], "dome-hi"), 4))),
      h("div", { class: "caps", style: "margin:12px 0 6px" }, "Scenery palette (closed set)"),
      h("div", { class: "swatches" }, Object.keys(P.PALETTE).map((k) => h("span", null, h("i", { style: `background:${pal[k] || P.PALETTE[k]}` }), k))));
  }

  /* ── keyboard ── */
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") { clearSelection(); return; }
    const main = document.getElementById("main");
    if ((ev.key === "ArrowDown" || ev.key === "ArrowUp") && main.contains(document.activeElement)) {
      const items = [...main.querySelectorAll("[data-sel]")];
      const i = items.indexOf(document.activeElement);
      if (i < 0) return;
      ev.preventDefault();
      const nxt = items[Math.max(0, Math.min(items.length - 1, i + (ev.key === "ArrowDown" ? 1 : -1)))];
      nxt.focus();
    }
  });

  window.addEventListener("hashchange", () => { readHash(); render(); });
  window.addEventListener("resize", () => drawScenes(angleNow));
  reducedMotion.addEventListener("change", render);
  twinkleTimer = setInterval(() => { if (motionOn() && S.study === "a") { twinkle++; drawScenes(angleNow); } }, 1800);

  readHash();
  angleNow = P.quantize(target().angle);
  render();
})();
</script>
</body>
</html>
