<!doctype html>
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Observatory pixel studies</title>
<meta name="description" content="Three pixel-art treatments (courtyard, instrument, atlas) around one working Observstory interface. Synthetic data.">

<style>
/* tokens.css */
/* Observatory design tokens — PROPOSAL (pixel-design study, 31 Oct 2026).
 *
 * Status: study tokens, not shipping tokens. Final palette waits for the owner's
 * templates (see RECOMMENDATION.md → "Decisions awaiting templates").
 *
 * Inherited laws (docs/development/ui-language.md, docs/ui/design-language.md):
 *   - one accent, reserved for "a conversation is needed";
 *   - selection and focus use a separate cool colour, never the accent;
 *   - confidence is shape (dash), not colour;
 *   - no traffic-light red/amber/green.
 *
 * New in this study:
 *   - the accent is the observatory's warm window: it is lit only when the
 *     loaded snapshot carries an overlap / waiting signal or a declared-vs-observed cue;
 *   - scenery colours (--px-*) are a separate, closed palette used only by pixel art;
 *     UI never reads them and pixel art never uses UI text colours.
 */

:root {
  color-scheme: dark;

  /* ── Night (default for the study) ─────────────────────────────── */
  --sky-0: #0a0e15;   /* page, deepest sky */
  --sky-1: #10161f;   /* panels: sidebar, inspector */
  --sky-2: #151d28;   /* raised: hover, header */
  --sky-3: #1c2633;   /* active row, input */
  --hair: #222c39;    /* 1px separators */
  --hair-2: #2e3a4a;  /* stronger separator, graticule */

  --ink: #e4e7ea;     /* primary text  (≈14.9:1 on --sky-1) */
  --ink-2: #a2abb5;   /* secondary     (≈7.6:1) */
  --ink-3: #6f7a87;   /* tertiary, ages, rule lines (≈4.1:1 — never for body copy) */

  --mark: #8db5c9;    /* neutral data mark: a work item in flight (existing dark token) */
  --mark-dim: #57707e;/* stale / landed marks (receding, not hidden) */
  --select: #78aaf5;  /* selection, focus ring, telescope reticle */
  --select-t: #16243a;/* selected row background */
  --accent: #f09a45;  /* conversation needed — the lit window (existing dark token) */
  --accent-t: #2b1d10;/* accent wash behind attention rows */
  --wire: #8d97a3;    /* waiting connectors (directed) */
  --declared: #c9b8e8;/* declared coordination text marker (rail only; not a signal colour) */
  --decor: #2f3b4d;   /* decorative stars drawn in UI surfaces (atlas): never mistaken for data */

  /* ── Pixel scenery palette (closed set; art only) ───────────────── */
  --px-void: #070a10;
  --px-sky-hi: #0d1420;
  --px-sky-lo: #142032;
  --px-star-decor: #3d4b60;   /* decorative stars: deliberately low contrast, 1 art px */
  --px-star-faint: #2a3546;
  --px-hill-far: #121a26;
  --px-hill-near: #0c121b;
  --px-stone: #3a4556;
  --px-stone-hi: #56637a;
  --px-dome: #8492a3;
  --px-dome-hi: #b6c0cc;
  --px-dome-lo: #5b6779;
  --px-slit: #05080c;
  --px-window-off: #2a2219;   /* unlit window: warm but dark */
  --px-window-on: var(--accent);
  --px-glow: rgba(240, 154, 69, 0.18);
  --px-brass: #9a8a6a;        /* telescope fittings (study B) */
  --px-tube: #c9d1da;

  /* ── Type ───────────────────────────────────────────────────────── */
  --font-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Inter", "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --fs-xs: 11px;   /* rule lines, ages, coordinates */
  --fs-sm: 12px;   /* labels, lane caps, mono refs */
  --fs-md: 13px;   /* body rows (GitHub density) */
  --fs-lg: 15px;   /* inspector title */
  --lh: 1.45;
  --caps-track: 0.08em;

  /* ── Space & shape ──────────────────────────────────────────────── */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  --radius: 6px;          /* rows, pills, inputs */
  --radius-panel: 8px;    /* floating inspector only */
  --row-h: 32px;
  --bar-h: 36px;

  /* ── Pixel scale: 1 art pixel = N CSS px, integer only ──────────── */
  --px-scale: 3;          /* desktop; 2 under 768px */

  /* ── Motion ─────────────────────────────────────────────────────── */
  --t-fast: 120ms;
  --t-turn: 600ms;        /* telescope turn, stepped in 8 art-angle steps */
  --ease: cubic-bezier(.2, .7, .2, 1);
}

/* Paper — a light variant so the existing light-primary map rules stay reachable.
 * Night is the study default because the scenery is a night sky. */
:root[data-theme="paper"] {
  color-scheme: light;
  --sky-0: #efeee9; --sky-1: #f8f7f3; --sky-2: #f2f1ec; --sky-3: #e8e6df;
  --hair: #dedbd3; --hair-2: #cfccc3;
  --ink: #1c1d1f; --ink-2: #4f5357; --ink-3: #6e7175;
  --mark: #2f5467; --mark-dim: #8a9aa3; --select: #0a66d6; --select-t: #e3edfb;
  --accent: #b4530a; --accent-t: #fbefe4; --wire: #6e6e73; --declared: #5b4a85;
  --decor: #d9d6cd;
}

/* Direction D — living observatory: dusk instead of night.
 * Warm cream ink, violet shadows, copper and moss in the scenery. The attention
 * accent becomes a brighter signal orange so it stays distinct from the always-on
 * amber lamp (ambient, decorative) and the copper dome (scenery). */
:root[data-direction="d"] {
  /* Brutalist shell: concrete in shadow, recessed slabs, lit windows. */
  --sky-0: #16171c; --sky-1: #1d1f25; --sky-2: #24272e; --sky-3: #2b2e36;
  --hair: #343842; --hair-2: #454a55;
  --ink: #e8e4dc; --ink-2: #b4b2ad; --ink-3: #8a8984;
  --mark: #e6dccb; --mark-dim: #84837e;
  --select: #6fae9a; --select-t: #1f3330;   /* sage: selection and focus */
  --accent: #ff9550; --accent-t: #3a2320;   /* signal: needs a conversation */
  --lamp: #f0b35a;                          /* lit window: work in flight */
  --recess: #121318;
  --wire: #b9b5ad; --decor: #2f323a;
  --l-thread: #b9b5ad;
  --paper: #efe3c6; --paper-ink: #2a2233;
  --px-void: #191b38;
  --font-label: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
}
:root[data-direction="d"][data-theme="paper"] {
  --sky-0: #efece6; --sky-1: #f8f6f1; --sky-2: #f1eee8; --sky-3: #e7e3db;
  --hair: #dcd7cd; --hair-2: #cdc7bc; --ink: #221d2b; --ink-2: #514a5c; --ink-3: #6f6878;
  --mark: #3e3560; --mark-dim: #8e88a6; --select: #2f5fd0; --select-t: #e3e9fb;
  --accent: #c2541a; --accent-t: #fbeee4; --wire: #6c6478;
}

@media (max-width: 767px) {
  :root { --px-scale: 2; }
}
</style>
<style>
/* src/study.css */
/* Observatory pixel-design study — layout and components.
 * Colour comes only from tokens.css. */

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--sky-0);
  color: var(--ink);
  font: var(--fs-md)/var(--lh) var(--font-ui);
  -webkit-font-smoothing: antialiased;
}
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--select); outline-offset: 1px; border-radius: 3px; }
.mono { font-family: var(--font-mono); font-size: var(--fs-sm); }
.caps { text-transform: uppercase; letter-spacing: var(--caps-track); font-size: var(--fs-xs); color: var(--ink-3); font-weight: 600; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
canvas.px { image-rendering: pixelated; display: block; }

/* ── Study chrome (not product UI) ─────────────────────────────── */
.study-bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s4);
  padding: var(--s2) var(--s4); border-bottom: 1px solid var(--hair);
  background: repeating-linear-gradient(135deg, var(--sky-1) 0 6px, var(--sky-0) 6px 12px);
}
.study-bar h1 { font-size: var(--fs-md); margin: 0; font-weight: 600; }
.study-bar .notice { color: var(--ink-2); font-size: var(--fs-sm); }
.seg { display: inline-flex; border: 1px solid var(--hair-2); border-radius: var(--radius); overflow: hidden; background: var(--sky-1); }
.seg button { border: 0; background: none; padding: 3px 10px; cursor: pointer; font-size: var(--fs-sm); color: var(--ink-2); border-right: 1px solid var(--hair); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--sky-3); color: var(--ink); box-shadow: inset 0 -2px 0 var(--select); }
.seg-label { font-size: var(--fs-xs); color: var(--ink-3); margin-right: 4px; }
.ctl { display: inline-flex; align-items: center; }
.spacer { flex: 1; }

/* ── App frame ─────────────────────────────────────────────────── */
.app {
  margin: var(--s4); border: 1px solid var(--hair-2); border-radius: var(--radius-panel);
  overflow: hidden; background: var(--sky-1);
  display: grid; grid-template-rows: var(--bar-h) auto 1fr 26px; min-height: 640px;
}
.titlebar {
  display: flex; align-items: center; gap: var(--s3); padding: 0 var(--s3);
  background: var(--sky-2); border-bottom: 1px solid var(--hair); min-width: 0;
}
.wordmark { display: flex; align-items: center; gap: 6px; font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
.wordmark canvas { width: 18px; height: 18px; }
.titlebar .repo { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.titlebar .status { margin-left: auto; color: var(--ink-2); font-size: var(--fs-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.titlebar .status b { color: var(--ink); font-weight: 600; }
.titlebar .status .acc { color: var(--accent); }
.horizon { height: 0; }
.horizon canvas { width: auto; }
.horizon { background: var(--px-sky-hi); }
.app[data-study="a"] .horizon { height: auto; border-bottom: 1px solid var(--hair); }

.body { display: grid; grid-template-columns: 248px minmax(0, 1fr) 320px; min-height: 0; }
.side { border-right: 1px solid var(--hair); display: flex; flex-direction: column; min-height: 0; background: var(--sky-1); }
.mainpane { min-width: 0; background: var(--sky-0); overflow: auto; position: relative; }
.rail { border-left: 1px solid var(--hair); overflow: auto; background: var(--sky-1); }

.statusbar {
  display: flex; gap: var(--s4); align-items: center; padding: 0 var(--s3);
  border-top: 1px solid var(--hair); background: var(--sky-2); font-size: var(--fs-xs); color: var(--ink-2);
  white-space: nowrap; overflow: hidden;
}
.statusbar .dot { display: inline-block; width: 6px; height: 6px; margin-right: 6px; vertical-align: 1px; background: var(--ink-3); }
.statusbar .dot.on { background: var(--accent); }
.statusbar .dot.sel { background: var(--select); }

/* ── Sidebar ───────────────────────────────────────────────────── */
.side-section { padding: var(--s3) var(--s3) var(--s2); }
.side-section + .side-section { border-top: 1px solid var(--hair); }
.navlist { list-style: none; margin: 6px 0 0; padding: 0; }
.navlist button {
  width: 100%; display: flex; align-items: center; gap: 8px; border: 0; background: none; text-align: left;
  padding: 4px 6px; border-radius: var(--radius); cursor: pointer; color: var(--ink-2);
}
.navlist button:hover { background: var(--sky-2); color: var(--ink); }
.navlist button[aria-current="true"] { background: var(--sky-3); color: var(--ink); }
.navlist .count { margin-left: auto; font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--ink-3); }
.navlist .sub button { padding-left: 22px; font-family: var(--font-mono); font-size: var(--fs-sm); }
.scene { position: relative; margin-top: auto; border-top: 1px solid var(--hair); }
.scene canvas { width: auto; }
.scene { background: var(--px-hill-near); }
.scene .caption { font-size: var(--fs-xs); color: var(--ink-2); padding: 6px var(--s3) 8px; border-top: 1px solid var(--hair); }
.instrument { position: relative; border-bottom: 1px solid var(--hair); background: var(--px-void); }
.instrument canvas { width: auto; }
.instrument .stage { width: max-content; margin: 0 auto; }
.instrument .lane-tag { position: absolute; font-size: 10px; letter-spacing: var(--caps-track); text-transform: uppercase; color: var(--ink-3); transform: translate(-50%, -50%); pointer-events: none; }
.instrument .lane-tag.on { color: var(--select); font-weight: 700; }
.instrument .readout { font-size: var(--fs-xs); color: var(--ink-2); font-family: var(--font-mono); padding: 6px var(--s3); border-top: 1px solid var(--hair); background: var(--sky-1); }
.instrument .stage { position: relative; }

/* ── Main: shared ──────────────────────────────────────────────── */
.pane-head { display: flex; align-items: baseline; gap: var(--s3); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--hair); background: var(--sky-1); position: sticky; top: 0; z-index: 2; }
.pane-head h2 { font-size: var(--fs-md); margin: 0; font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: var(--s3); margin-left: auto; font-size: var(--fs-xs); color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.glyph { display: inline-block; vertical-align: middle; flex: none; }
.empty { padding: var(--s5) var(--s4); color: var(--ink-2); }

/* Board (study A map) */
.board { display: grid; grid-template-columns: repeat(4, minmax(170px, 1fr)); gap: 0; min-height: 100%; }
.lane { border-right: 1px solid var(--hair); padding: var(--s3); min-width: 0; }
.lane:last-child { border-right: 0; }
.lane-head { margin-bottom: var(--s2); }
.lane-head .desc { font-size: var(--fs-xs); color: var(--ink-3); }
.lane.quiet .lane-head .caps::after { content: " · quiet"; font-weight: 400; }
.group { border: 1px solid var(--hair); border-radius: var(--radius); background: var(--sky-1); margin-bottom: var(--s2); }
.group-head { display: flex; justify-content: space-between; padding: 5px 8px; border-bottom: 1px solid var(--hair); font-family: var(--font-mono); font-size: var(--fs-sm); color: var(--ink-2); }
.group.attn { border-color: color-mix(in srgb, var(--accent) 55%, var(--hair)); }
.also { padding: 4px 8px; font-size: var(--fs-xs); color: var(--ink-3); border-top: 1px dashed var(--hair); }

/* Work-item row (board, list, field label) */
.row {
  display: grid; grid-template-columns: 14px auto 1fr auto; align-items: center; gap: 8px;
  width: 100%; min-height: var(--row-h); padding: 4px 8px; border: 0; border-left: 2px solid transparent;
  background: none; text-align: left; cursor: pointer; color: var(--ink);
}
.row + .row { border-top: 1px solid var(--hair); }
.row:hover { background: var(--sky-2); }
.row[aria-pressed="true"] { background: var(--select-t); border-left-color: var(--select); }
.row .ref { font-family: var(--font-mono); font-size: var(--fs-sm); color: var(--ink-2); white-space: nowrap; }
.row .label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .age { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--ink-3); white-space: nowrap; }
.row .pills { grid-column: 3 / 5; display: flex; gap: 4px; flex-wrap: wrap; }
.row.stale, .row.draft { opacity: .62; }
.dimmed .row:not(.related):not([aria-pressed="true"]), .dimmed .fnode:not(.related):not(.sel), .dimmed .astar:not(.related):not(.sel) { opacity: .35; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-xs); padding: 0 6px; border-radius: 99px; border: 1px solid var(--hair-2); color: var(--ink-2); line-height: 18px; white-space: nowrap; }
.pill.overlap { border-color: var(--accent); color: var(--accent); background: var(--accent-t); }
.pill.waiting { border-style: dashed; border-color: var(--wire); }
.pill.stale { border-style: dotted; }

.board .row { grid-template-columns: 14px minmax(0, 1fr) auto; row-gap: 2px; align-items: center; }
.board .row > .glyph { grid-area: 1 / 1; }
.board .row .ref { grid-area: 1 / 2; font-size: var(--fs-xs); overflow: hidden; text-overflow: ellipsis; }
.board .row .age { grid-area: 1 / 3; }
.board .row .label { grid-area: 2 / 2 / 3 / 4; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.board .row .pills { grid-area: 3 / 2 / 4 / 4; }

/* List (all studies) */
.list-group { border-bottom: 1px solid var(--hair); }
.list-group h3 { margin: 0; padding: 8px var(--s4) 4px; }
.list .row { padding-left: var(--s4); padding-right: var(--s4); grid-template-columns: 14px 56px 84px 128px minmax(0,1fr) auto auto; }
.app:not([data-study="b"]) .list .row { grid-template-columns: 14px 0 84px 128px minmax(0,1fr) auto auto; column-gap: 8px; }
.list .row .coord { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--ink-3); }
.list .row .area { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .row .pills { grid-column: auto; }

/* Field (study B map): recency scale */
.field { position: relative; padding: var(--s3) var(--s4) var(--s5); }
.field svg { width: 100%; height: auto; display: block; overflow: visible; }
.fnode { cursor: pointer; }
.fnode text { font-family: var(--font-mono); font-size: 11px; fill: var(--ink-2); }
.fnode.sel text { fill: var(--ink); font-weight: 700; }
.fnode:focus { outline: none; }
.fnode:focus-visible .ring { stroke: var(--select); stroke-width: 2; }

/* Atlas (study C map) */
.atlas { padding: var(--s3); position: relative; }
.cartouche { position: absolute; right: 28px; bottom: 26px; display: flex; gap: 10px; align-items: flex-end; font-size: 11px; color: var(--ink-2); text-align: right; }
.atlas svg { width: 100%; height: auto; display: block; background: var(--sky-0); }
.astar { cursor: pointer; }
.astar:focus { outline: none; }
.astar:focus-visible .ring, .astar.sel .ring { stroke: var(--select); stroke-width: 1.5; }
.astar text, .cluster text { font-family: var(--font-mono); font-size: 11px; }
.halo { paint-order: stroke; stroke: var(--sky-0); stroke-width: 4px; stroke-linejoin: round; }

/* Replay */
.replay { padding: var(--s3) var(--s4) var(--s5); display: grid; gap: var(--s3); }
.feeds { display: grid; gap: 4px; }
.feed { display: grid; grid-template-columns: 16px 220px 1fr; gap: 8px; align-items: baseline; font-size: var(--fs-sm); padding: 4px 8px; border: 1px solid var(--hair); border-radius: var(--radius); background: var(--sky-1); }
.feed.off { color: var(--ink-3); border-style: dashed; }
.transport { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); padding: var(--s2); border: 1px solid var(--hair); border-radius: var(--radius); background: var(--sky-1); }
.transport button, .transport select { background: var(--sky-3); border: 1px solid var(--hair-2); border-radius: var(--radius); padding: 2px 10px; cursor: pointer; }
.transport input[type=range] { flex: 1; min-width: 160px; accent-color: var(--select); }
.ticks { position: relative; height: 10px; margin: -4px 8px 0; }
.ticks i { position: absolute; top: 0; width: 1px; height: 6px; background: var(--hair-2); }
.ticks i.add { height: 8px; background: var(--mark-dim); }
.ticks i.remove { height: 8px; background: var(--ink-3); }
.ticks i.cur { background: var(--select); height: 10px; width: 2px; }
.event-card { border: 1px solid var(--hair); border-left: 2px solid var(--select); border-radius: var(--radius); padding: var(--s2) var(--s3); background: var(--sky-1); }
.event-card .meta { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--ink-3); }
table.areas { border-collapse: collapse; width: 100%; font-size: var(--fs-sm); }
table.areas th, table.areas td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--hair); }
table.areas th { font-weight: 600; color: var(--ink-3); font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: var(--caps-track); }
table.areas td.n { font-family: var(--font-mono); text-align: right; }
table.areas tr.cur td { background: var(--select-t); }
.note { font-size: var(--fs-sm); color: var(--ink-2); border-left: 2px solid var(--hair-2); padding: 2px 10px; }

/* ── Rail: attention, declared, collection, inspector ──────────── */
.rail section { padding: var(--s3); border-bottom: 1px solid var(--hair); }
.rail h2 { margin: 0 0 6px; }
.attn-item { display: grid; grid-template-columns: 12px 1fr; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 6px; border-radius: var(--radius); cursor: pointer; color: var(--ink); }
.attn-item:hover { background: var(--sky-2); }
.attn-item[aria-pressed="true"] { background: var(--select-t); }
.attn-item .rule { display: block; font-size: var(--fs-xs); color: var(--ink-3); }
.attn-item .conf { font-family: var(--font-mono); }
.attn-item.overlap .lbl, .attn-item.waiting .lbl { color: var(--ink); }
.attn-item.overlap { box-shadow: inset 2px 0 0 var(--accent); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: var(--fs-sm); margin: 0; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; }
.kv dd.skipped { color: var(--accent); }

/* ── D · living sky ────────────────────────────────────────────── */
.living { border-bottom: 1px solid var(--hair); background: #191b38; }

/* ── D · round 3 shell (Weavr-aligned workbench) ───────────────── */

.d-two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--s4); }

@media (max-width: 1240px) {

  .d-status { grid-template-columns: auto 1fr; }

}

/* ── D · round 4: brutalist shell (concrete, recess, joints, one chamfer) ── */

.app[data-study="d"] .d-h1 { font: 700 34px var(--font-label); letter-spacing: .06em; text-transform: uppercase; }

.app[data-study="d"] .d-status-t { font: 700 23px var(--font-label); letter-spacing: .06em; text-transform: uppercase; }
.app[data-study="d"] .d-portrait { width: 104px; height: 88px; background: var(--px-void); }

.app[data-study="d"] .feed, .app[data-study="d"] .transport, .app[data-study="d"] .transport button, .app[data-study="d"] .transport select, .app[data-study="d"] .event-card { border-radius: 0; }

    position: fixed; left: 0; right: 0; bottom: 0; max-height: 72vh; overflow: auto; z-index: 10;
    border-top: 2px solid var(--select); box-shadow: 0 -12px 32px rgba(0,0,0,.5);
  }
  .statusbar .hide-sm { display: none; }
  .atlas { overflow-x: auto; }
  .atlas svg { min-width: 760px; }
  .cartouche { position: static; justify-content: flex-end; margin-top: 8px; }
}

@media (prefers-reduced-motion: reduce) {

<noscript><p style="padding:16px">This study page renders with JavaScript (no network access needed).</p></noscript>
<script>
/* src/pixels.js */
/* Observatory pixel kit — deterministic, procedural, dependency-free.
 *
 * Editable source of every pixel asset in the study. The same functions draw
 * to <canvas> in the study page and to SVG files in build.mjs, so the
 * exported assets in assets/ are byte-for-byte reproducible.
 *
 * Model: a PixelBuffer is a w×h grid of palette *names* (strings). Drawing
 * functions only write names; colours are resolved at render time from
 * PALETTE (or from matching --px-* CSS custom properties in the page).
 *
 * Rules enforced here (see README → "Pixel rules"):
 *   - integer scale only; one art pixel is never split or anti-aliased;
 *   - scenery uses the closed --px-* palette; the only shared colour is the
 *     accent, and it appears only as the lit window (state, not decoration);
 *   - decorative stars are 1 art px and dim; data stars use STAR_GLYPHS (5×5)
 *     and are drawn by the UI layer, never by scenery;
 *   - everything random is seeded (mulberry32), so a seed always yields the
 *     same picture.
 */
(function (root) {
  "use strict";

  const PALETTE = {
    "void": "#070a10",
    "sky-hi": "#0d1420",
    "sky-lo": "#142032",
    "star-decor": "#3d4b60",
    "star-faint": "#2a3546",
    "hill-far": "#121a26",
    "hill-near": "#0c121b",
    "stone": "#3a4556",
    "stone-hi": "#56637a",
    "stone-lo": "#283140",
    "dome": "#8492a3",
    "dome-hi": "#b6c0cc",
    "dome-lo": "#5b6779",
    "slit": "#05080c",
    "window-off": "#2a2219",
    "window-on": "#f09a45",
    "glow": "#2e2116",
    "brass": "#9a8a6a",
    "tube": "#c9d1da",
    "tube-lo": "#8792a0",
    "leaf": "#101a1c",
    "leaf-hi": "#16252a",
    "mark": "#8db5c9",
    "mark-dim": "#57707e",
    "select": "#78aaf5",
    "accent": "#f09a45",
  };

  /* Lane → azimuth (degrees from zenith, negative = west/left).
   * Stable by lane order, never by activity: the telescope turning means
   * "you selected something in this lane", not "something happened here". */
  const AZIMUTH = { intent: -50, build: -18, verify: 18, ship: 50, other: 0 };
  const PARKED = 0;

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function hash(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h;
  }

  class PixelBuffer {
    constructor(w, h) {
      this.w = w;
      this.h = h;
      this.px = new Array(w * h).fill(null);
    }
    set(x, y, name) {
      x = Math.round(x); y = Math.round(y);
      if (x < 0 || y < 0 || x >= this.w || y >= this.h) return;
      this.px[y * this.w + x] = name;
    }
    get(x, y) {
      if (x < 0 || y < 0 || x >= this.w || y >= this.h) return null;
      return this.px[y * this.w + x];
    }
    rect(x, y, w, h, name) {
      for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.set(x + i, y + j, name);
    }
    /* Stamp a character grid. legend maps chars to palette names; '.' is transparent. */
    grid(x, y, rows, legend) {
      rows.forEach((row, j) => {
        [...row].forEach((ch, i) => {
          if (ch !== "." && legend[ch]) this.set(x + i, y + j, legend[ch]);
        });
      });
    }
  }

  /* ── Scenery ─────────────────────────────────────────────────────── */

  /* Night sky: two-tone ordered dither (no gradients) + seeded 1px decorative stars.
   * `quiet` is a list of {x,y,w,h} rects that must stay free of decorative stars
   * (labels, data, anything readable). */
  function sky(buf, seed, opts = {}) {
    const rnd = mulberry32(seed);
    const bayer = [0, 2, 3, 1];
    const split = opts.horizon ?? buf.h;
    for (let y = 0; y < buf.h; y++) {
      const t = y / Math.max(1, split);
      for (let x = 0; x < buf.w; x++) {
        const thr = (bayer[(x & 1) + 2 * (y & 1)] + 0.5) / 4;
        const m = (t - 0.62) / 0.22;                // dither only in a narrow band
        buf.set(x, y, opts.solid ? opts.solid : m >= 1 || (m > 0 && m > thr) ? "sky-lo" : "sky-hi");
      }
    }
    const density = opts.density ?? 0.012;
    const n = Math.round(buf.w * split * density);
    const quiet = opts.quiet || [];
    for (let i = 0; i < n; i++) {
      const x = Math.floor(rnd() * buf.w);
      const y = Math.floor(rnd() * split * 0.92);
      const bright = rnd() > 0.82;
      if (quiet.some((q) => x >= q.x && x < q.x + q.w && y >= q.y && y < q.y + q.h)) continue;
      buf.set(x, y, bright ? "star-decor" : "star-faint");
    }
  }

  /* Seeded 1-D value noise, smoothed — used for hill silhouettes. */
  function ridge(seed, w, base, amp, period) {
    const rnd = mulberry32(seed);
    const knots = [];
    for (let i = 0; i <= Math.ceil(w / period) + 1; i++) knots.push(rnd());
    const out = [];
    for (let x = 0; x < w; x++) {
      const k = x / period, i = Math.floor(k), f = k - i;
      const s = f * f * (3 - 2 * f);
      out.push(Math.round(base - amp * (knots[i] * (1 - s) + knots[i + 1] * s)));
    }
    return out;
  }

  function hills(buf, seed, groundY) {
    const far = ridge(seed, buf.w, groundY - 2, 9, 22);
    const near = ridge(seed + 7, buf.w, groundY + 1, 4, 13);
    for (let x = 0; x < buf.w; x++) {
      for (let y = far[x]; y < buf.h; y++) buf.set(x, y, "hill-far");
      for (let y = near[x]; y < buf.h; y++) buf.set(x, y, "hill-near");
    }
  }

  const TREE = [
    "...a...",
    "..aaa..",
    "..aAa..",
    ".aaaaa.",
    ".aAaaa.",
    "aaaaaAa",
    ".aaaaa.",
    "aaaAaaa",
    "...s...",
    "...s...",
  ];
  function tree(buf, x, groundY) {
    buf.grid(x, groundY - TREE.length, TREE, { a: "leaf", A: "leaf-hi", s: "stone-lo" });
  }

  /* The observatory: a stone house with a rotating dome.
   *   state.angle   telescope azimuth in degrees (−60…60); the dome slit rotates with it
   *   state.open    shutter open (something is selected) / closed (parked)
   *   state.lit     window lit = the loaded snapshot asks for a conversation
   * Returns anchor points so the UI can align labels. */
  function observatory(buf, x, groundY, state = {}) {
    const W = 26, H = 12, R = 12;
    const top = groundY - H;
    const cx = x + 13;
    const angle = quantize(state.angle ?? PARKED);
    const open = !!state.open;
    const lit = !!state.lit;

    // Glow first, so the house draws over it.
    if (lit) {
      for (let j = 0; j < 3; j++) {
        for (let i = -j; i < 4 + j; i++) {
          const gx = x + 5 + i, gy = groundY + j;
          if (buf.get(gx, gy) && (j < 2 || (gx + gy) % 2 === 0)) buf.set(gx, gy, "glow");
        }
      }
    }

    // House body with brick courses.
    for (let j = 0; j < H; j++) {
      for (let i = 0; i < W; i++) {
        let c = i > W - 8 ? "stone-lo" : "stone";
        if (j === 0) c = "stone-hi";
        else if (j % 4 === 0 && (i + (j % 8 === 0 ? 0 : 3)) % 6 !== 0) c = "stone-lo";
        buf.set(x + i, top + j, c);
      }
    }
    // Ledge under the dome.
    buf.rect(x - 1, top - 1, W + 2, 1, "stone-hi");

    // Dome (semicircle) with light from upper left.
    const base = top - 1;
    for (let dy = 0; dy <= R; dy++) {
      const half = Math.floor(Math.sqrt(R * R - dy * dy));
      for (let dx = -half; dx <= half; dx++) {
        const edge = Math.abs(dx) === half || dy === R;
        let c = "dome";
        if (dx < -half / 3 && dy > R / 3) c = "dome-hi";
        if (dx > half / 2) c = "dome-lo";
        if (edge) c = "dome-lo";
        buf.set(cx + dx, base - dy, c);
      }
    }

    // Slit: rotates with the telescope (projected onto the dome face).
    const slitX = Math.round(cx + Math.sin(rad(angle)) * R * 0.6);
    for (let dy = 1; dy <= R; dy++) {
      const half = Math.floor(Math.sqrt(R * R - dy * dy));
      for (let k = -1; k <= 1; k++) {
        const sx = slitX + k;
        if (Math.abs(sx - cx) > half - 1) continue;
        buf.set(sx, base - dy, open ? "slit" : (k === 0 ? "dome-lo" : buf.get(sx, base - dy)));
      }
    }

    // Telescope tube through the open slit.
    let tip = null;
    if (open) {
      const px = slitX, py = base - 3;
      tip = tube(buf, px, py, angle, 15, 2);
    }

    // Window (lit or not) and door.
    const wx = x + 5, wy = top + 3;
    buf.rect(wx - 1, wy - 1, 6, 7, "stone-lo");
    buf.rect(wx, wy, 4, 5, lit ? "window-on" : "window-off");
    buf.rect(wx + 2, wy, 1, 5, "stone-lo");
    buf.rect(wx, wy + 2, 4, 1, "stone-lo");
    buf.rect(x + 17, top + 4, 5, 8, "stone-lo");
    buf.rect(x + 18, top + 5, 3, 7, "slit");

    return { cx, base, slitX, tip, window: { x: wx, y: wy, w: 4, h: 5 }, door: { x: x + 17, y: top + 4 } };
  }

  /* A tube of given thickness along `angle` (deg from vertical) from (x,y). */
  function tube(buf, x, y, angle, len, thick) {
    const a = rad(angle);
    const ux = Math.sin(a), uy = -Math.cos(a);
    const nx = -uy, ny = ux;
    for (let t = 0; t <= len; t += 0.5) {
      for (let k = 0; k < thick; k++) {
        const px = x + ux * t + nx * (k - (thick - 1) / 2);
        const py = y + uy * t + ny * (k - (thick - 1) / 2);
        buf.set(px, py, k === 0 ? "tube" : "tube-lo");
      }
    }
    const tx = Math.round(x + ux * len), ty = Math.round(y + uy * len);
    buf.set(tx, ty, "brass");
    return { x: tx, y: ty };
  }

  /* Study B — a refractor on a German equatorial mount, for the instrument panel.
   * Counterweight sits on the declination axis (perpendicular to the tube). */
  function refractor(buf, x, groundY, state = {}) {
    const angle = quantize(state.angle ?? PARKED);
    const a = rad(angle);
    const ux = Math.sin(a), uy = -Math.cos(a);
    let nx = Math.cos(a), ny = Math.sin(a);
    if (ny < 0 || (ny === 0 && nx > 0)) { nx = -nx; ny = -ny; }   // n points downward
    // Pier, feet, mount head.
    buf.rect(x - 2, groundY - 14, 4, 14, "stone");
    buf.rect(x + 1, groundY - 14, 1, 14, "stone-lo");
    buf.rect(x - 6, groundY - 1, 12, 1, "stone-hi");
    buf.rect(x - 5, groundY, 10, 1, "stone-lo");
    buf.rect(x - 3, groundY - 18, 6, 4, "brass");
    buf.rect(x + 1, groundY - 18, 2, 4, "stone-lo");
    const px = x, py = groundY - 20;
    // Counterweight shaft and weight (down side).
    tube(buf, px, py, Math.atan2(nx, -ny) * 180 / Math.PI, 7, 1);
    buf.rect(Math.round(px + nx * 8) - 1, Math.round(py + ny * 8) - 1, 3, 3, "stone-hi");
    // Main tube, dew shield, finder (up side), eyepiece.
    tube(buf, px - ux * 6, py - uy * 6, angle, 24, 3);
    const tip = tube(buf, px + ux * 18, py + uy * 18, angle, 6, 5);
    tube(buf, px - nx * 3 + ux * 2, py - ny * 3 + uy * 2, angle, 7, 1);
    buf.rect(Math.round(px - ux * 7) - 1, Math.round(py - uy * 7) - 1, 2, 2, "brass");
    buf.rect(Math.round(px) - 1, Math.round(py) - 1, 2, 2, "brass");
    return { pivot: { x: px, y: py }, tip };
  }

  /* Graduated azimuth arc around a pivot. Ticks every 10°, long ticks at lane azimuths. */
  function arc(buf, cx, cy, r, laneIds) {
    for (let d = -70; d <= 70; d += 5) {
      const a = rad(d);
      const long = laneIds.some((id) => AZIMUTH[id] === d);
      const len = long ? 3 : d % 10 === 0 ? 1 : 0;
      for (let k = 0; k <= len; k++) {
        buf.set(cx + Math.sin(a) * (r + k), cy - Math.cos(a) * (r + k), long ? "stone-hi" : "stone");
      }
    }
  }

  /* Eyepiece field (study B inspector). Field stars are decorative and 1px;
   * data glyphs are added by the UI on top. */
  function eyepiece(buf, seed) {
    const cx = (buf.w - 1) / 2, cy = (buf.h - 1) / 2, r = Math.min(cx, cy);
    const rnd = mulberry32(seed);
    for (let y = 0; y < buf.h; y++) {
      for (let x = 0; x < buf.w; x++) {
        const d = Math.hypot(x - cx, y - cy);
        if (d <= r - 2) buf.set(x, y, "void");
        else if (d <= r) buf.set(x, y, "stone");
      }
    }
    for (let i = 0; i < 26; i++) {
      const x = Math.floor(rnd() * buf.w), y = Math.floor(rnd() * buf.h);
      if (buf.get(x, y) === "void" && Math.hypot(x - cx, y - cy) > 6) buf.set(x, y, "star-faint");
    }
    // Reticle: dashed crosshair with a gap at the centre.
    for (let t = 0; t < buf.w; t++) {
      if (Math.abs(t - cx) < 5 || t % 3 === 2) continue;
      if (buf.get(t, Math.round(cy)) === "void" || buf.get(t, Math.round(cy)) === "star-faint") buf.set(t, Math.round(cy), "stone");
      if (buf.get(Math.round(cx), t) === "void" || buf.get(Math.round(cx), t) === "star-faint") buf.set(Math.round(cx), t, "stone");
    }
  }

  /* ── Data glyphs (UI layer) ──────────────────────────────────────
   * 5×5, one per work-item status. Shape carries status so it survives
   * greyscale; colour only adds selection (select) or attention (accent). */
  const STAR_GLYPHS = {
    in_flight: ["..x..", "..x..", "xxXxx", "..x..", "..x.."],
    draft:     ["..x..", ".....", "x.X.x", ".....", "..x.."],
    stale:     [".....", "..x..", ".xXx.", "..x..", "....."],
    landed:    [".xxx.", "x...x", "x...x", "x...x", ".xxx."],
  };

  /* 9×9 icons. One-colour silhouettes; meaning is also always written in text. */
  const ICONS = {
    overlap:  [".........", ".xxx.....", "x...x....", "x..xxxx..", "x..x.x.x.", ".xxxx..x.", "...x...x.", "....xxx..", "........."],
    waiting:  [".........", "....x....", "....xx...", "xxxxxxx..", "....xx...", "....x....", ".........", "x.x.x.x..", "........."],
    stale:    [".........", "..xxxxx..", ".x.....x.", ".x..x..x.", ".x..xx.x.", ".x.....x.", "..xxxxx..", ".........", "........."],
    declared: [".........", ".xxxxxx..", ".x....x..", ".x.xx.x..", ".x....x..", ".x.xx.x..", ".x....x..", ".xxxxxx..", "........."],
    plate:    [".........", "xxxxxxxxx", "x.......x", "x..x....x", "x.xxx...x", "x..x..x.x", "x.......x", "xxxxxxxxx", "........."],
    bell:     ["....x....", "...xxx...", "..xxxxx..", "..xxxxx..", "..xxxxx..", ".xxxxxxx.", "xxxxxxxxx", "....x....", "........."],
    dome:     [".........", "...xxx...", "..xx.xx..", ".xxx.xxx.", ".xxx.xxx.", "xxxxxxxxx", "x.x...x.x", "x.x...x.x", "xxxxxxxxx"],
  };

  function glyph(buf, x, y, rows, name, centerName) {
    rows.forEach((row, j) => [...row].forEach((ch, i) => {
      if (ch === "x") buf.set(x + i, y + j, name);
      if (ch === "X") buf.set(x + i, y + j, centerName || name);
    }));
  }

  /* ── Renderers ───────────────────────────────────────────────── */

  function resolve(name, overrides) {
    return (overrides && overrides[name]) || PALETTE[name] || "#ff00ff";
  }

  function toCanvas(canvas, buf, scale, overrides) {
    canvas.width = buf.w * scale;
    canvas.height = buf.h * scale;
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let y = 0; y < buf.h; y++) {
      for (let x = 0; x < buf.w; x++) {
        const n = buf.px[y * buf.w + x];
        if (!n) continue;
        ctx.fillStyle = resolve(n, overrides);
        ctx.fillRect(x * scale, y * scale, scale, scale);
      }
    }
  }

  /* SVG with horizontal run-length rects; shape-rendering keeps edges crisp. */
  function toSVG(buf, overrides, title) {
    const rects = [];
    for (let y = 0; y < buf.h; y++) {
      let x = 0;
      while (x < buf.w) {
        const n = buf.px[y * buf.w + x];
        let run = 1;
        while (x + run < buf.w && buf.px[y * buf.w + x + run] === n) run++;
        if (n) rects.push(`<rect x="${x}" y="${y}" width="${run}" height="1" fill="${resolve(n, overrides)}"/>`);
        x += run;
      }
    }
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${buf.w} ${buf.h}" width="${buf.w * 4}" height="${buf.h * 4}" shape-rendering="crispEdges">` +
      (title ? `<title>${title}</title>` : "") + rects.join("") + `</svg>\n`;
  }

  /* Read --px-* custom properties so tokens.css stays the single source of colour. */
  function paletteFromCSS(el) {
    if (typeof getComputedStyle === "undefined") return {};
    const cs = getComputedStyle(el || document.documentElement);
    const out = {};
    for (const k of Object.keys(PALETTE)) {
      const v = cs.getPropertyValue("--px-" + k).trim();
      if (v && !v.startsWith("var(")) out[k] = v;
    }
    const acc = cs.getPropertyValue("--accent").trim();
    if (acc) { out["window-on"] = acc; out.accent = acc; }
    for (const k of ["mark", "mark-dim", "select"]) {
      const v = cs.getPropertyValue("--" + k).trim();
      if (v) out[k] = v;
    }
    return out;
  }

  function rad(d) { return (d * Math.PI) / 180; }
  function quantize(d) { return Math.round(d / 5) * 5; }

  root.ObsPixels = {
    PALETTE, AZIMUTH, PARKED, STAR_GLYPHS, ICONS,
    PixelBuffer, mulberry32, hash,
    sky, hills, tree, observatory, refractor, arc, eyepiece, tube, glyph,
    toCanvas, toSVG, paletteFromCSS, quantize,
  };
})(typeof window !== "undefined" ? window : globalThis);
</script>
<script>
/* src/creature.js */
/* Direction D — the living observatory. Editable pixel source.
 *
 * The observatory *is* the creature: a copper dome like an oversized shell,
 * a telescope like a curious snout, two attic windows that read as eyes only
 * through their light, a stone foundation folded into tucked paws, moss in the
 * seams, an amber side door where someone is always working.
 *
 * Every pose parameter maps either to project state or to a declared
 * decorative habit (see README → "D · behaviour law"). Nothing here decides
 * what a pose means; the engine (living.js) does, from typed state.
 *
 * Depends on ObsPixels (pixels.js). Adds the dusk palette to it.
 */
(function (root) {
  "use strict";
  const P = root.ObsPixels;

  Object.assign(P.PALETTE, {
    "dusk-0": "#191b38", "dusk-1": "#212448", "dusk-2": "#2c2b55", "dusk-3": "#3e3560", "dusk-4": "#56426a",
    "cream": "#f3e6c4", "cream-dim": "#8e88a6", "cream-faint": "#5d5880",
    "moss-0": "#1f3029", "moss-1": "#2b4434", "moss-2": "#3f6040", "moss-3": "#6b8c4c", "fern": "#557a45",
    "rock-0": "#2e2a3a", "rock-1": "#4d4759", "rock-2": "#6d6679", "rock-3": "#938a9c",
    "plaster": "#b3a8ae", "plaster-lo": "#857a8b",
    "copper-0": "#5e3227", "copper-1": "#8c4d33", "copper-2": "#b56b45", "copper-3": "#d99263",
    "patina": "#5b998b", "patina-hi": "#86bfac",
    "brass-0": "#7d6136", "brass-1": "#c39d58", "brass-2": "#e2c487",
    "lamp-dim": "#8f6c49", "lamp": "#f2cf8f", "lamp-hi": "#fff0c8",
    "ink": "#15121f", "paper": "#efe3c6", "signal": "#ff9550", "smoke": "#a7a1b6",
  });

  const W = 46, H = 44;               // sprite box (art px); ground at H-4
  const rad = (d) => (d * Math.PI) / 180;

  /* Dusk sky: indigo above, violet toward the horizon, narrow dither seams.
   * `drift` slides the decorative star field (history moves the sky). */
  function duskSky(buf, seed, opts = {}) {
    const bands = ["dusk-0", "dusk-1", "dusk-2", "dusk-3", "dusk-4"];
    const stops = opts.stops || [0, 0.34, 0.6, 0.8, 0.93];
    const bayer = [0, 2, 3, 1];
    const hzn = opts.horizon ?? buf.h;
    for (let y = 0; y < buf.h; y++) {
      const t = y / hzn;
      let i = 0;
      while (i < stops.length - 1 && t >= stops[i + 1]) i++;
      const next = Math.min(i + 1, bands.length - 1);
      const span = (stops[i + 1] ?? 1) - stops[i];
      const f = (t - stops[i]) / span;        // 0..1 inside band
      for (let x = 0; x < buf.w; x++) {
        const thr = (bayer[(x & 1) + 2 * (y & 1)] + 0.5) / 4;
        buf.set(x, y, f > 0.9 && (f - 0.9) / 0.1 > thr ? bands[next] : bands[i]);   // narrow seams only
      }
    }
    const rnd = P.mulberry32(seed);
    const n = Math.round(buf.w * hzn * (opts.density ?? 0.01));
    const drift = Math.round(opts.drift || 0);
    const quiet = opts.quiet || [];
    for (let k = 0; k < n; k++) {
      const x = ((Math.floor(rnd() * buf.w * 2) + drift) % buf.w + buf.w) % buf.w;
      const y = Math.floor(rnd() * hzn * 0.8);
      const b = rnd();
      if (quiet.some((q) => x >= q.x && x < q.x + q.w && y >= q.y && y < q.y + q.h)) continue;
      buf.set(x, y, b > 0.9 ? "cream-dim" : "cream-faint");
    }
  }

  /* A rounded grassy hill rising from the left, with tufts. */
  function hill(buf, seed, x0, x1, top, ground) {
    const rnd = P.mulberry32(seed);
    for (let x = 0; x < buf.w; x++) {
      let y;
      if (x < x0) y = top;
      else if (x < x1) { const f = (x - x0) / (x1 - x0); y = Math.round(top + (ground - top) * (0.5 - 0.5 * Math.cos(f * Math.PI))); }
      else y = ground;
      for (let j = y; j < buf.h; j++) buf.set(x, j, j === y ? "moss-2" : j - y < 3 ? "moss-1" : "moss-0");
      if (rnd() < 0.18) buf.set(x, y - 1, "moss-2");
      if (rnd() < 0.06) { buf.set(x, y - 1, "moss-3"); buf.set(x, y - 2, "moss-3"); }
    }
  }

  const FERN = ["..f..f", ".f.ff.", "f.ff..", ".ff.f.", "ff....", ".f...."];

  /* The creature. pose:
   *   angle    telescope azimuth, degrees from vertical (+ = right)
   *   eyes     "closed" | "half" | "open" | "wide"
   *   look     -1 | 0 | 1   pupils
   *   lean     -1 | 0 | 1   upper body shifts against a turn (weight)
   *   settle   0 | 1        breathing: upper body sinks one pixel
   *   lift     0 | 1        dome lifts (listening)
   *   door     0 | 1 | 2    side-door lamp: dim / working / bright
   *   lantern  bool         signal lantern under the telescope (attention)
   *   note     bool         paper slip pinned by the door (declared commitment)
   *   chart    0..4         star chart poking out of the hatch
   *   smoke    0..6         chimney puff frame
   */
  function creature(buf, x, g, pose = {}) {
    const p = Object.assign({ angle: 35, eyes: "open", look: 0, lean: 0, settle: 0, lift: 0, door: 1, lantern: false, note: false, chart: 0, smoke: 0 }, pose);
    const set = (a, b, c) => buf.set(a, b, c);

    // ── foundation (folded body) ──
    const fx0 = x + 7, fx1 = x + 38, ftop = g - 13;
    for (let j = 0; j < 13; j++) {
      const inset = j === 0 ? 2 : j === 1 ? 1 : 0;
      for (let i = fx0 + inset; i <= fx1 - inset; i++) {
        let c = "rock-2";
        if (i < fx0 + 3) c = "rock-3";
        if (i > fx1 - 7) c = "rock-1";
        if (j > 10) c = "rock-1";
        if (j % 4 === 3 && (i + (j % 8 === 3 ? 0 : 3)) % 7 !== 0) c = i > fx1 - 7 ? "rock-0" : "rock-1";
        set(i, ftop + j, c);
      }
    }
    // paws, tucked forward
    const paw = (px) => {
      for (let j = 0; j < 5; j++) for (let i = 0; i < 9; i++) {
        if (j === 0 && (i === 0 || i === 8)) continue;
        let c = j === 0 ? "rock-3" : j === 4 ? "rock-1" : "rock-2";
        if ((i === 3 || i === 6) && j >= 3) c = "rock-0";
        set(px + i, g - 5 + j, c);
      }
    };
    paw(x + 3); paw(x + 33);
    // moss along the seams
    const rnd = P.mulberry32(91);
    for (let i = fx0 + 2; i <= fx1 - 2; i++) {
      set(i, ftop, rnd() < 0.3 ? "moss-3" : "moss-2");
      if (rnd() < 0.25) set(i, ftop + 1, "moss-1");
      if (rnd() < 0.08) set(i, ftop + 2, "moss-1");
    }
    for (let i = 0; i < 9; i++) if (rnd() < 0.5) set(x + 3 + i, g - 5, "moss-2");
    for (let i = 0; i < 9; i++) if (rnd() < 0.4) set(x + 33 + i, g - 5, "moss-2");
    buf.grid(x + 1, g - 10, FERN, { f: "fern" });

    // side door, always a little lit: someone is working inside
    const dx = x + 15, dtop = g - 10;
    for (let j = 0; j < 9; j++) for (let i = 0; i < 6; i++) {
      if (j === 0 && (i === 0 || i === 5)) continue;
      const edge = i === 0 || i === 5 || j === 0;
      let c = edge ? "rock-0" : p.door === 0 ? "lamp-dim" : "lamp";
      if (!edge && p.door === 2 && i > 1 && i < 4 && j > 2) c = "lamp-hi";
      set(dx + i, dtop + j, c);
    }
    set(dx + 3, dtop + 5, "brass-1");
    if (p.door > 0) for (let k = 0; k < 4; k++) for (let i = -k; i < 6 + k; i++) if ((i + k) % 2 === 0 || k === 0) {
      if (buf.get(dx + i, g + k)) set(dx + i, g + k, k === 0 ? "moss-3" : "lamp-dim");
    }
    if (p.note) { buf.rect(x + 23, g - 9, 3, 4, "paper"); set(x + 24, g - 8, "ink"); set(x + 24, g - 9, "brass-1"); }

    // ── upper body: drum with eyes, chimney, hatch ──
    const ux = x + p.lean, uy = -p.settle;
    const D0 = x + 9 + p.lean, D1 = x + 35 + p.lean, dTop = ftop - 7 + uy;
    for (let j = 0; j < 7; j++) for (let i = D0; i <= D1; i++) {
      let c = i > D1 - 7 ? "plaster-lo" : "plaster";
      if (j === 0) c = "copper-1";
      if (j === 6) c = "plaster-lo";
      set(i, dTop + j, c);
    }
    // eyes: attic windows (6×5 with frame)
    const eye = (ex) => {
      for (let j = 0; j < 5; j++) for (let i = 0; i < 6; i++) {
        const frame = i === 0 || i === 5 || j === 0 || j === 4;
        set(ex + i, dTop + 1 + j, frame ? "rock-0" : "lamp");
      }
      const ix = ex + 1, iy = dTop + 2;           // interior 4×3
      const pupX = ix + 1 + p.look;
      if (p.eyes === "open") { set(pupX, iy + 1, "ink"); set(pupX + 1, iy + 1, "ink"); set(pupX, iy + 2, "ink"); set(pupX + 1, iy + 2, "ink"); }
      if (p.eyes === "wide") { for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++) set(ix + i, iy + j, "lamp-hi"); set(pupX, iy + 1, "ink"); set(pupX + 1, iy + 1, "ink"); }
      if (p.eyes === "half") { for (let i = 0; i < 4; i++) set(ix + i, iy, "copper-1"); set(pupX, iy + 2, "ink"); set(pupX + 1, iy + 2, "ink"); }
      if (p.eyes === "closed") { for (let i = 0; i < 4; i++) { set(ix + i, iy, "copper-1"); set(ix + i, iy + 1, "copper-1"); set(ix + i, iy + 2, "lamp-dim"); } }
    };
    eye(ux + 12); eye(ux + 25);
    // hatch + chart
    set(D0, dTop + 2, "ink"); set(D0, dTop + 3, "ink"); set(D0, dTop + 4, "ink");
    for (let k = 1; k <= p.chart; k++) { set(D0 - k, dTop + 3, "paper"); if (k < 3) set(D0 - k, dTop + 2, "paper"); if (k === 2) set(D0 - k, dTop + 3, "cream-dim"); }
    // ── dome, an oversized patched copper shell ──
    const R = 12, ccx = ux + 22, base = dTop - 1 - p.lift;
    if (p.lift) for (let i = ccx - R + 1; i <= ccx + R - 1; i++) set(i, dTop - 1, "ink");
    for (let dy = 0; dy <= R; dy++) {
      const half = Math.floor(Math.sqrt(R * R - dy * dy) + 0.3);
      for (let dxx = -half; dxx <= half; dxx++) {
        let c = "copper-2";
        if (dxx < -half / 3 && dy > R / 3) c = "copper-3";
        if (dxx > half / 2) c = "copper-1";
        if (Math.abs(dxx) === half || dy === R) c = "copper-0";
        if (dy === 3 && (dxx + 30) % 3 === 0 && Math.abs(dxx) < half) c = "copper-0";   // rivets
        set(ccx + dxx, base - dy, c);
      }
    }
    [[-7, 5], [-6, 5], [-6, 6], [-5, 6], [5, 8], [6, 8], [6, 9], [2, 10]].forEach(([a, b]) => set(ccx + a, base - b, "patina"));
    set(ccx - 6, base - 6, "patina-hi");
    for (let i = -2; i <= 1; i++) for (let j = 5; j <= 7; j++) set(ccx + i, base - j, (i === -2 || i === 1 || j === 5 || j === 7) ? "copper-1" : "copper-2");
    set(ccx - 2, base - 7, "copper-3"); set(ccx + 1, base - 5, "copper-3");

    // slit faces the telescope
    const a = rad(p.angle);
    const slitX = Math.round(ccx + Math.sin(a) * R * 0.5);
    for (let dy = 2; dy <= R - 1; dy++) {
      const half = Math.floor(Math.sqrt(R * R - dy * dy));
      for (let k = -1; k <= 1; k++) if (Math.abs(slitX + k - ccx) < half) set(slitX + k, base - dy, "ink");
    }

    // chimney + smoke
    const cx0 = ux + 33;
    for (let j = 0; j < 6; j++) for (let i = 0; i < 3; i++) set(cx0 + i, dTop - 5 + j, j === 0 ? "rock-3" : i === 2 ? "rock-1" : "rock-2");
    if (p.smoke > 0) {
      const f = p.smoke;
      const puff = (ox, oy, r) => { for (let i = -r; i <= r; i++) for (let j = -r; j <= r; j++) if (Math.abs(i) + Math.abs(j) <= r) set(cx0 + 1 + ox + i, dTop - 7 - oy + j, "smoke"); };
      puff(0, f, f > 4 ? 0 : 1);
      if (f > 2) puff(1, f + 3, 0);
    }

    // ── telescope snout ──
    const pvx = slitX, pvy = base - 5;
    const ux1 = Math.sin(a), uy1 = -Math.cos(a), nx = -uy1, ny = ux1;
    for (let t = 0; t <= 16; t += 0.5) {
      const thick = t > 12 ? 4 : 3;                       // dew shield
      for (let k = 0; k < thick; k++) {
        const o = k - (thick - 1) / 2;
        const px = pvx + ux1 * t + nx * o, py = pvy + uy1 * t + ny * o;
        set(px, py, (t > 6 && t < 7.5) || (t > 11.5 && t < 12.5) ? "copper-1" : k === 0 ? "brass-2" : k === thick - 1 ? "brass-0" : "brass-1");
      }
    }
    const tipX = Math.round(pvx + ux1 * 16.5), tipY = Math.round(pvy + uy1 * 16.5);
    set(tipX, tipY, "ink"); set(tipX + Math.round(nx), tipY + Math.round(ny), "ink");
    if (p.lantern) {
      const lx = Math.round(pvx + ux1 * 12), ly = Math.round(pvy + uy1 * 12) + 2;
      set(lx, ly, "ink"); set(lx, ly + 1, "ink");
      buf.rect(lx - 1, ly + 2, 3, 3, "signal"); set(lx, ly + 3, "lamp-hi");
    }
    return { pivot: { x: pvx, y: pvy }, tip: { x: tipX, y: tipY }, box: { x, y: g - H + 4, w: W, h: H } };
  }

  function moth(buf, x, y, f) {
    buf.set(x, y, "cream-dim");
    if (f % 2) { buf.set(x - 1, y - 1, "cream"); buf.set(x + 1, y - 1, "cream"); }
    else { buf.set(x - 1, y, "cream"); buf.set(x + 1, y, "cream"); }
  }

  /* Angle (deg from vertical) from the telescope pivot to an art-space point. */
  function aimAt(pivot, pt) {
    const d = (Math.atan2(pt.x - pivot.x, pivot.y - pt.y) * 180) / Math.PI;
    return Math.max(-20, Math.min(80, P.quantize(d)));
  }

  /* ── The walking observatory (round 3) ───────────────────────────
   * A turtle whose shell is the dome. Low-fi on purpose: flat 2–3-tone
   * materials, drawn for 5–6× display, like Weavr's sidebar character.
   *
   * pose:
   *   raise    0..5    0 = lying down (just a building), 5 = standing
   *   step     0 | 1   walking gait (alternating legs), only meaningful when raised
   *   head     0..4    how far the head comes out of the shell
   *   eyes     "closed" | "half" | "open" | "wide"
   *   angle    telescope azimuth, deg from vertical (+ = right)
   *   lantern  bool    signal lantern under the telescope (attention)
   *   door     0 | 1 | 2
   *   settle   0 | 1   breathing
   *   note     bool    paper slip on the door (declared commitment)
   * Box: 44 × 36 art px; x is the left edge, g the ground row. */
  function turtle(buf, x, g, pose = {}) {
    const p = Object.assign({ raise: 0, step: 0, head: 0, eyes: "closed", angle: 40, lantern: false, door: 1, settle: 0, note: false }, pose);
    const set = (a, b, c) => buf.set(a, b, c);
    const r = p.raise;
    const bb = g - 1 - r + p.settle;            // body bottom row
    const B0 = x + 5, B1 = x + 34;              // body band span

    // legs (behind the body first: far side, darker)
    if (r > 0) {
      const leg = (lx, far, lifted) => {
        const top = bb + 1, bot = g - (lifted ? 1 : 0);
        for (let y = top; y <= bot; y++) for (let i = 0; i < 4; i++) set(lx + i, y, far ? "rock-1" : i === 0 ? "rock-3" : "rock-2");
        if (!far) { set(lx - 1, bot, "rock-2"); set(lx + 4, bot, "rock-2"); }
      };
      leg(x + 11, true, p.step === 0); leg(x + 31, true, p.step === 1);
      leg(x + 8, false, p.step === 1); leg(x + 27, false, p.step === 0);
      // tail
      if (r > 2) { set(x + 3, bb - 2, "rock-2"); set(x + 4, bb - 2, "rock-2"); set(x + 2, bb - 1, "rock-1"); }
    } else {
      // lying down: a stone plinth with moss, the house sits on the ground
      for (let i = B0 - 1; i <= B1 + 1; i++) { set(i, g, "rock-1"); if ((i * 7) % 5 === 0) set(i, g, "moss-2"); }
    }

    // head + neck (front, right)
    const hx = B1 - 1 + p.head;
    const hy = bb - 5 - (r > 2 ? 1 : 0);
    for (let j = 0; j < 4; j++) for (let i = 0; i < 5; i++) {
      if ((i === 4 && (j === 0 || j === 3))) continue;
      set(hx + i, hy + j, j === 0 ? "rock-3" : j === 3 ? "rock-1" : "rock-2");
    }
    if (p.head > 0) for (let i = B1 - 1; i < hx; i++) { set(i, hy + 1, "rock-2"); set(i, hy + 2, "rock-1"); }
    const ex = hx + 2, ey = hy + 1;
    if (p.eyes === "open") { set(ex, ey, "lamp-hi"); set(ex + 1, ey, "ink"); }
    else if (p.eyes === "wide") { set(ex, ey, "lamp-hi"); set(ex + 1, ey, "lamp-hi"); set(ex, ey + 1, "ink"); }
    else if (p.eyes === "half") { set(ex, ey + 1, "lamp"); set(ex + 1, ey + 1, "ink"); }
    else { set(ex, ey + 1, "rock-0"); set(ex + 1, ey + 1, "rock-0"); }

    // body band: plaster ring with lit windows and the side door
    for (let j = 0; j < 8; j++) for (let i = B0; i <= B1; i++) {
      let c = i > B1 - 8 ? "plaster-lo" : "plaster";
      if (j === 0) c = "copper-0";
      if (j === 4 && (i % 6) === 2) c = "plaster-lo";
      if (j === 7) c = "rock-1";
      set(i, bb - 7 + j, c);
    }
    [[x + 15, 0], [x + 21, 0]].forEach(([wx]) => { buf.rect(wx, bb - 5, 3, 2, "lamp"); set(wx + 2, bb - 4, "lamp-dim"); set(wx + 1, bb - 5, "rock-0"); set(wx + 1, bb - 4, "rock-0"); });
    for (let j = 0; j < 6; j++) for (let i = 0; i < 3; i++) set(x + 8 + i, bb - 6 + j, j === 0 && i !== 1 ? "plaster" : j === 0 ? "rock-0" : p.door === 0 ? "lamp-dim" : p.door === 2 && i === 1 ? "lamp-hi" : "lamp");
    if (p.note) { set(x + 12, bb - 5, "paper"); set(x + 12, bb - 4, "paper"); set(x + 13, bb - 5, "paper"); }

    // shell = dome, with scute seams, patina and a little moss
    const R = 12, cx = x + 19, base = bb - 8;
    for (let dy = 0; dy <= R; dy++) {
      const half = Math.floor(Math.sqrt(R * R - dy * dy) * 1.06 + 0.3);
      for (let d = -half; d <= half; d++) {
        let c = "copper-2";
        if (d < -half * 0.35 && dy > 3) c = "copper-3";
        if (d > half * 0.55) c = "copper-1";
        if (dy === 4 && Math.abs(d) < half - 1) c = "copper-1";                  // scute ring
        if ((d === -5 || d === 5) && dy > 4 && dy < 9) c = "copper-1";          // scute seams
        set(cx + d, base - dy, c);
      }
    }
    [[-8, 2], [-7, 2], [-7, 3], [6, 6], [7, 6], [2, 9]].forEach(([a, b]) => set(cx + a, base - b, "patina"));
    [[-3, 11], [-2, 11], [1, 11], [4, 10]].forEach(([a, b]) => set(cx + a, base - b, "moss-3"));

    // slit faces the telescope; telescope pokes out
    const a = rad(p.angle);
    const sx = Math.round(cx + Math.sin(a) * 6);
    for (let dy = 3; dy <= R - 1; dy++) { set(sx, base - dy, "ink"); set(sx + 1, base - dy, "ink"); }
    const px = sx + 0.5, py = base - 5;
    const ux = Math.sin(a), uy = -Math.cos(a), nx = -uy, ny = ux;
    for (let t2 = 0; t2 <= 14; t2 += 0.5) for (let k = 0; k < 2; k++) set(px + ux * t2 + nx * k, py + uy * t2 + ny * k, t2 > 11 ? (k === 0 ? "brass-1" : "brass-0") : k === 0 ? "brass-2" : "brass-0");
    set(Math.round(px + ux * 14.5), Math.round(py + uy * 14.5), "ink");
    if (p.lantern) {
      const lx = Math.round(px + ux * 10), ly = Math.round(py + uy * 10) + 1;
      set(lx, ly, "ink"); buf.rect(lx - 1, ly + 1, 3, 3, "signal"); set(lx, ly + 2, "lamp-hi");
    }
  }

  root.ObsCreature = { W, H, duskSky, hill, creature, moth, aimAt, turtle };
})(typeof window !== "undefined" ? window : globalThis);
</script>
<script>
/* src/living.js */
/* Direction D — living sky engine.
 *
 * The observatory watches its sky (the project map) and keeps a few habits:
 *   listens before it looks — door brightens, dome lifts, then the telescope turns;
 *   has weight              — the body leans against a turn, hesitates halfway, settles;
 *   draws by hand           — a relation (overlap / waiting) is inked once, then kept;
 *   is comfortable at rest  — eyes closed, one lamp lit, tends its chart, a moth visits.
 *
 * Law: habits are decoration and may stop at any time (reduced motion, Motion off);
 * every *state* they reflect is also stated in text by the page. The engine never
 * invents a relation: it only inks edges it is given, and only animates commits
 * during replay, where the event really is a commit.
 */
(function (root) {
  "use strict";
  const P = root.ObsPixels, C = root.ObsCreature;
  const SVGNS = "http://www.w3.org/2000/svg";

  function el(tag, attrs, ...kids) {
    const e = tag.startsWith("svg:") ? document.createElementNS(SVGNS, tag.slice(4)) : document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "on") for (const [ev, fn] of Object.entries(v)) e.addEventListener(ev, fn);
      else e.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat(3)) if (k != null && k !== false) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
    return e;
  }

  function create() {
    const node = el("div", { class: "living" });
    const scroller = el("div", { class: "living-scroll" });
    const stage = el("div", { class: "living-stage" });
    const bg = el("canvas", { class: "px", "aria-hidden": "true" });
    const actor = el("canvas", { class: "px actor", "aria-hidden": "true" });
    const fx = el("canvas", { class: "px fx", "aria-hidden": "true" });
    const svg = document.createElementNS(SVGNS, "svg");
    svg.setAttribute("class", "living-data");
    const tags = el("div", { class: "living-tags" });
    const greet = el("button", { type: "button", class: "greet", "aria-label": "Greet the observatory (decorative)" });
    const bell = el("button", { type: "button", class: "bell", "data-key": "living:bell" });
    const note = el("div", { class: "living-note", role: "status", hidden: true });
    stage.append(bg, svg, actor, fx, tags, greet, bell, note);
    scroller.append(stage);
    node.append(scroller);

    let M = null;                  // last model
    let S = 3, W = 0, H = 0;       // scale and art size
    let bgBuf = null, layout = null, lastDrift = null, lastW = 0;
    let hover = null;              // {x,y} art point the viewer is looking at
    const traced = new Set();
    let timer = null;
    const REST_ANGLE = 70;            // resting: snout lowered toward the horizon
    const st = { t: 0, angle: REST_ANGLE, target: REST_ANGLE, seq: null, ack: 0, notes: 0, smoke: 0, chart: 0, cool: 0 };

    const motion = () => M && M.motion;
    const pal = () => P.paletteFromCSS();

    /* ── geometry ── */
    function measure() {
      // The living scene is one picture at one integer scale: 4× desktop, 3× small screens.
      S = window.innerWidth < 768 ? 3 : 4;
      const cw = Math.max(node.clientWidth || 900, 720);
      W = Math.floor(cw / S);
      const noC = M && M.creature === false;      // creature lives elsewhere: no hill band needed

    function computeLayout() {

        ns.forEach((s) => {
          let a = (P.hash(s.id) % 8) * 45, p;
          for (let k = 0; k < 8; k++, a += 45) {
            const r = ns.length === 1 ? 0 : 9;

    function dotPos(d) {

    function pointFor(id) {
      if (!id || !layout) return null;
      if (layout.stars[id]) return layout.stars[id];
      if (layout.clusters[id]) return layout.clusters[id];
      const e = M.edges.find((x) => x.id === id);
      if (e && layout.stars[e.from] && layout.stars[e.to]) {
        const a = layout.stars[e.from], b = layout.stars[e.to];

    /* ── drawing ── */
    function drawBg() {

    function pose() {
      const rest = M.mood === "rest";
      const p = {
        angle: st.angle, eyes: rest ? "closed" : "open", look: 0, lean: 0, settle: 0, lift: 0,
        door: M.loaded ? 1 : 0, lantern: !!M.lantern, note: !!M.note, chart: st.chart, smoke: st.smoke,

    function startLoop() {

    /* ── data layer ── */

        const x = p.s;
        const sel = M.selId === x.id;
        const g = add(el("svg:g", {
          class: "lstar " + x.status + (sel ? " sel" : "") + (rel && !rel.has(x.id) ? " dim" : ""), tabindex: 0, role: "button",

    /* ── interactions with the creature itself ── */
    greet.addEventListener("click", () => {
      if (st.cool > 0) return;
      st.ack = 8; st.smoke = 1; st.cool = 40;
      if (!motion()) drawActor();
    });
    bell.addEventListener("click", () => {
      note.hidden = false;
      note.replaceChildren(el("b", null, "Last look: "), M.lookText.when, el("br"), M.lookText.how,
        el("button", { type: "button", class: "note-close", "data-key": "living:note-close", on: { click: () => { note.hidden = true; bell.focus(); } } }, "OK"));
      st.notes = 25;
      clearTimeout(note._t); note._t = setTimeout(() => { note.hidden = true; }, 9000);
      if (!motion()) drawActor();
    });

    function update(model) {
      const prev = M;
      M = model;
      measure();
      layout = computeLayout();
      stage.style.width = W * S + "px"; stage.style.height = H * S + "px";
      drawBg();
      drawData();

      Object.assign(bell.style, { left: (CX + 48) * S + "px", top: (G() - 14) * S + "px" });
      Object.assign(note.style, { left: (CX + 48) * S + "px", top: (G() - 44) * S + "px" });
      if (!motion()) { st.angle = st.target; st.seq = null; }
      retarget();
      if (!motion()) st.angle = st.target;
      drawActor();
      if (M.replay && prev && prev.replay && M.replay.pos === prev.replay.pos + 1 && M.replay.event) {

    return { node, update };
  }

<script>
/* src/ornament.js */
/* Direction D — the observatory tortoise as a corner ornament (like Weavr's sidebar character).
 *
 * Frames are the owner's painted north star, pixelated (creature/frames, see creature/rig/README.md).
 * Posture is the one state it carries, and the page always says it in words too:
 *   rest   — dome closed, sleepy eyes: nothing needs a conversation
 *   up     — dome open, telescope out, lantern lit: an overlap or wait exists
 *   travel — up, with a slow one-pixel plod: replay is playing
 * Blinking, breathing, glow and flicker are decoration: they stop with reduced motion.
 */
(function (root) {
  "use strict";
  const W = 320, H = 179, FOOT = 140;
  const CROP = [74, 0, 236, 152];
  const FACE = [74, 62, 104, 88];
  const BOX = { eyeNear: [116, 74, 46, 37], eyeFar: [79, 86, 21, 27], lantern: [142, 35, 12, 14] };
  const PIVOT = [182, 40];
  const NIGHT = [25, 27, 56];

  let px = null, rank = null, nDiff = 0, ready = null;
  const hash = (i) => { let h = (i * 2654435761) >>> 0; h ^= h >>> 15; return (h % 1000) / 1000; };
  const inBox = (x, y, b) => x >= b[0] && x < b[0] + b[2] && y >= b[1] && y < b[1] + b[3];

  function load() {
    if (ready) return ready;
    const F = root.ObsFrames || {};
    const get = (src) => new Promise((res) => {
      const im = new Image();
      im.onload = () => { const c = document.createElement("canvas"); c.width = W; c.height = H; const x = c.getContext("2d"); x.drawImage(im, 0, 0); res(x.getImageData(0, 0, W, H).data); };
      im.onerror = () => res(null);
      im.src = src;
    });
    ready = Promise.all([get(F.cutUp), get(F.cutRest)]).then(([up, rest]) => {
      if (!up || !rest) return;
      px = { up, rest };
      // the dome opens as a reveal spreading out from the slit
      const diff = [];
      for (let i = 0; i < W * H; i++) {
        const k = i * 4, x = i % W, y = (i / W) | 0;
        if (inBox(x, y, BOX.eyeNear) || inBox(x, y, BOX.eyeFar)) continue;
        if (up[k + 3] !== rest[k + 3] || up[k] !== rest[k] || up[k + 1] !== rest[k + 1] || up[k + 2] !== rest[k + 2]) diff.push([i, Math.hypot(x - PIVOT[0], (y - PIVOT[1]) * 1.3) + hash(i) * 7]);
      }
      diff.sort((a, b) => a[1] - b[1]);
      rank = new Int32Array(W * H).fill(-1);
      diff.forEach(([i], r) => { rank[i] = r; });
      nDiff = diff.length;
    });
    return ready;
  }

  function compose(img, st) {
    const O = img.data, U = px.up, R = px.rest, t = st.t, motion = st.motion;
    // night ground with a few fixed pixel stars (decorative)
    for (let i = 0; i < W * H; i++) { const k = i * 4; O[k] = NIGHT[0]; O[k + 1] = NIGHT[1]; O[k + 2] = NIGHT[2]; O[k + 3] = 255; if (hash(i * 7 + 3) > 0.996 && ((i / W) | 0) < 70) { const tw = motion && hash(i + Math.floor(t / 5)) > 0.75 ? 0.55 : 1; O[k] = 230 * tw; O[k + 1] = 222 * tw; O[k + 2] = 200 * tw; } }
    const shown = Math.round(nDiff * st.open), upBase = st.open > 0.5;
    let eyesOpen = st.state !== "rest";
    if (motion && st.state !== "rest" && t % 62 > 59) eyesOpen = false;
    if (motion && st.state === "rest" && t % 150 > 134) eyesOpen = true;
    const rise = motion && ((st.state === "rest" && t % 44 < 9) || (st.state === "travel" && Math.floor(t / 3) % 2 === 0)) ? 1 : 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x;
      let src;
      if (inBox(x, y, BOX.eyeNear) || inBox(x, y, BOX.eyeFar)) src = eyesOpen ? U : R;
      else if (rank[i] >= 0) src = rank[i] < shown ? U : R;
      else src = upBase ? U : R;
      const k = i * 4;
      if (!src[k + 3]) continue;
      const dy = rise && y < FOOT && y > 0 ? y - 1 : y;
      const d = (dy * W + x) * 4;
      O[d] = src[k]; O[d + 1] = src[k + 1]; O[d + 2] = src[k + 2];
    }
    const warm = (k, f) => { if (O[k] > 150 && O[k] > O[k + 2] + 60) { O[k] = Math.min(255, O[k] * f); O[k + 1] = Math.min(255, O[k + 1] * f); } };
    if (motion && eyesOpen) { const f = 1 + 0.07 * Math.sin(t / 5); for (const b of [BOX.eyeNear, BOX.eyeFar]) for (let y = b[1]; y < b[1] + b[3]; y++) for (let x = b[0]; x < b[0] + b[2]; x++) warm((y * W + x) * 4, f); }
    if (motion && st.open > 0.5) { const f = 0.93 + 0.14 * hash(t); const b = BOX.lantern; for (let y = b[1]; y < b[1] + b[3]; y++) for (let x = b[0]; x < b[0] + b[2]; x++) warm((y * W + x) * 4, f); }
  }

  function paint(canvas, img, crop, scale) {
    const s = document.createElement("canvas"); s.width = W; s.height = H; s.getContext("2d").putImageData(img, 0, 0);
    canvas.width = crop[2] * scale; canvas.height = crop[3] * scale;
    const ctx = canvas.getContext("2d"); ctx.imageSmoothingEnabled = false;
    ctx.drawImage(s, crop[0], crop[1], crop[2], crop[3], 0, 0, crop[2] * scale, crop[3] * scale);
  }

  function create() {
    const node = document.createElement("div");
    node.className = "ornament";
    const cv = document.createElement("canvas");
    cv.className = "px"; cv.setAttribute("aria-hidden", "true");
    node.append(cv);
    const st = { state: "rest", motion: true, t: 0, open: 0 };
    const img = new ImageData(W, H);
    let timer = null;
    const draw = () => { if (px) { compose(img, st); paint(cv, img, CROP, 1); } };
    function tick() {
      if (!node.isConnected) return;
      st.t++;
      const target = st.state === "rest" ? 0 : 1;
      st.open += Math.max(-0.07, Math.min(0.07, target - st.open));
      draw();
    }
    function update(s) {
      st.state = s.state;
      const changed = st.motion !== s.motion;
      st.motion = s.motion;
      if (!s.motion) st.open = s.state === "rest" ? 0 : 1;
      if (changed || !timer) { clearInterval(timer); timer = s.motion ? setInterval(tick, 100) : null; }
      load().then(draw);
    }
    return { node, update };
  }

  function portrait(canvas, state) {
    load().then(() => {
      if (!px) return;
      const img = new ImageData(W, H);
      compose(img, { state, motion: false, t: 0, open: state === "rest" ? 0 : 1 });
      paint(canvas, img, FACE, 1);
    });
  }

  root.ObsOrnament = { create, portrait };
})(typeof window !== "undefined" ? window : globalThis);
</script>

<script>
/* src/study.js */
/* Observatory pixel-design study — interactive page.
 *
 * One working interface, three pixel treatments (A courtyard, B instrument,
 * C atlas) over identical synthetic data. Everything readable is HTML/SVG
 * text; pixel art only frames it. All source strings go through textContent.
 *
 * URL hash carries the full state so screenshots are reproducible:
 *   #study=a|b|c&state=quiet|overlap|replay&view=map|list&sel=<id>&pos=<n>&theme=night|paper&motion=on|off
 */
(function () {
  "use strict";
  const P = window.ObsPixels;
  const D = window.ObsData;

  const STUDIES = {
    a: { key: "a", name: "Courtyard", long: "A · Observatory courtyard" },
    b: { key: "b", name: "Instrument", long: "B · Telescope instrument" },
    c: { key: "c", name: "Atlas", long: "C · Star atlas" },
    d: { key: "d", name: "Living", long: "D · Living observatory" },
  };
  const ZONE_CODE = { intent: "INT", build: "BLD", verify: "VER", ship: "SHP" };
  const CONF = { high: "●", medium: "◐", low: "○" };

  const S = {
    study: "d", state: "overlap", view: "map", sel: null, pos: 11,
    theme: "night", motion: true, playing: false, speed: 1, lastView: "map",
  };
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  const SKELETON = document.getElementById("app").innerHTML;   // static template markup, no data
  let angleNow = P.PARKED, angleTimer = null, playTimer = null, twinkle = 0, twinkleTimer = null;
  let lastTrigger = null;

  /* ── tiny DOM helper (text only, never innerHTML for data) ── */
  function h(tag, attrs, ...kids) {
    const ns = attrs && attrs.ns;
    const e = ns ? document.createElementNS(ns, tag) : document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (k === "ns" || v == null || v === false) continue;
      if (k === "on") for (const [ev, fn] of Object.entries(v)) e.addEventListener(ev, fn);
      else if (k === "class") e.setAttribute("class", v);
      else e.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat(3)) {
      if (k == null || k === false) continue;
      e.append(k instanceof Node ? k : document.createTextNode(String(k)));
    }
    return e;
  }
  const SVGNS = "http://www.w3.org/2000/svg";
  const s = (tag, attrs, ...kids) => h(tag, Object.assign({ ns: SVGNS }, attrs), ...kids);

  /* ── hash state ── */
  function readHash() {
    const q = new URLSearchParams(location.hash.slice(1));
    if (STUDIES[q.get("study")]) S.study = q.get("study");
    if (["quiet", "overlap", "replay"].includes(q.get("state"))) S.state = q.get("state");
    if (["map", "list"].includes(q.get("view"))) S.view = q.get("view");
    S.sel = q.get("sel") || null;
    if (q.get("pos")) S.pos = Math.max(0, Math.min(D.EVENTS.length - 1, +q.get("pos") || 0));
    if (q.get("theme") === "paper") S.theme = "paper";
    if (q.get("motion") === "off") S.motion = false;
    S.dView = q.get("dview") === "sky" ? "sky" : "overview";
  }
  function writeHash() {
    const q = new URLSearchParams({ study: S.study, state: S.state, view: S.view });
    if (S.sel) q.set("sel", S.sel);
    if (S.state === "replay") q.set("pos", S.pos);
    if (S.theme !== "night") q.set("theme", S.theme);
    if (!S.motion) q.set("motion", "off");
    if (S.study === "d" && S.dView === "sky" && S.state !== "replay" && S.view !== "list") q.set("dview", "sky");
    history.replaceState(null, "", "#" + q.toString());
  }
  const motionOn = () => S.motion && !reducedMotion.matches;

  /* ── data access ── */
  const snap = () => D.STATES[S.state] || D.STATES.overlap;
  const groupById = (id) => D.GROUPS.find((g) => g.id === id);
  const zoneOfGroup = (id) => (groupById(id) || {}).zone;
  function nodeById(id) { return snap().nodes.find((n) => n.id === id); }
  function edgeById(id) { return snap().edges.find((e) => e.id === id); }
  function edgesOf(nodeId) { return snap().edges.filter((e) => e.from === nodeId || e.to === nodeId); }
  function relatedIds() {
    if (!S.sel) return null;
    const ids = new Set([S.sel]);
    const e = edgeById(S.sel);
    if (e) { ids.add(e.from); ids.add(e.to); }
    if (nodeById(S.sel)) edgesOf(S.sel).forEach((x) => { ids.add(x.from); ids.add(x.to); ids.add(x.id); });
    if (S.sel.startsWith("area:")) snap().nodes.filter((n) => n.group === S.sel).forEach((n) => ids.add(n.id));
    return ids;
  }
  function coord(n) {
    const g = groupById(n.group);
    const inZone = D.GROUPS.filter((x) => x.zone === g.zone);
    const gi = inZone.indexOf(g) + 1;
    const ni = snap().nodes.filter((x) => x.group === n.group).indexOf(n) + 1;
    return `${ZONE_CODE[g.zone]} ${gi}·${ni}`;
  }
  function age(hrs) {
    if (hrs < 1) return Math.round(hrs * 60) + "m";
    if (hrs < 48) return Math.round(hrs) + "h";
    return Math.floor(hrs / 24) + "d";
  }
  const STATUS_WORD = { in_flight: "in flight", draft: "draft", stale: "stale", landed: "landed" };

  /* Telescope target: lane of the selection, or of the replay event. Never activity. */
  function target() {
    if (S.state === "replay") {
      const ev = D.EVENTS[S.pos];
      const g = D.GROUPS.find((x) => x.path === ev.area);
      return { angle: P.AZIMUTH[g.zone], open: true, why: `following replay event in ${laneLabel(g.zone)} · ${ev.area}` };
    }
    if (!S.sel) return { angle: P.PARKED, open: false, why: S.study === "d" ? "telescope lowered — nothing selected" : "parked — nothing selected" };
    let zone = null, what = "";
    if (S.sel.startsWith("area:")) { zone = zoneOfGroup(S.sel); what = groupById(S.sel).path; }
    const n = nodeById(S.sel);
    if (n) { zone = zoneOfGroup(n.group); what = groupById(n.group).path; }
    const e = edgeById(S.sel);
    if (e) { const a = nodeById(e.from); zone = zoneOfGroup(a.group); what = e.areas.join(", "); }
    if (!zone) return { angle: P.PARKED, open: false, why: "parked" };
    return { angle: P.AZIMUTH[zone], open: true, why: `pointing at ${laneLabel(zone)} · ${what}` };
  }
  const laneLabel = (z) => (D.ZONES.find((x) => x.id === z) || {}).label || z;
  function windowLit() {
    const d = S.study === "d";
    if (S.state === "replay") return { lit: false, why: d ? "lantern dark — coordination is not reconstructed from commit history" : "window unlit — coordination is not reconstructed from commit history" };
    const n = snap().attention.filter((a) => a.kind === "overlap" || a.kind === "waiting").length;
    if (d) return n
      ? { lit: true, why: `lantern lit — ${n} signal${n > 1 ? "s" : ""} suggest a conversation` }
      : { lit: false, why: S.sel ? "lantern dark — nothing needs a conversation" : "resting — nothing needs a conversation" };
    return n
      ? { lit: true, why: `window lit — ${n} signal${n > 1 ? "s" : ""} suggest a conversation` }
      : { lit: false, why: "window unlit — nothing needs a conversation" };
  }

  /* ── glyphs ── */
  function glyphSVG(status, opts = {}) {
    const rows = P.STAR_GLYPHS[status] || P.STAR_GLYPHS.in_flight;
    const col = opts.sel ? "var(--select)" : status === "stale" || status === "landed" || status === "draft" ? "var(--mark-dim)" : "var(--mark)";
    const ctr = opts.attn ? "var(--accent)" : col;
    const u = opts.u || 2;
    const g = s("svg", { class: "glyph", width: 5 * u, height: 5 * u, viewBox: "0 0 5 5", "shape-rendering": "crispEdges", "aria-hidden": "true" });
    rows.forEach((r, y) => [...r].forEach((ch, x) => {
      if (ch === "x" || ch === "X") g.append(s("rect", { x, y, width: 1, height: 1, fill: ch === "X" ? ctr : col }));
    }));
    return g;
  }
  function iconSVG(name, color, u = 1.5) {
    const rows = P.ICONS[name];
    const g = s("svg", { class: "glyph", width: 9 * u, height: 9 * u, viewBox: "0 0 9 9", "shape-rendering": "crispEdges", "aria-hidden": "true" });
    rows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch === "x") g.append(s("rect", { x, y, width: 1, height: 1, fill: color })); }));
    return g;
  }

  /* ── selection ── */
  function select(id, trigger) {
    if (trigger) lastTrigger = trigger.getAttribute("data-key");
    S.sel = S.sel === id ? null : id;
    render();
  }
  function clearSelection() {
    if (!S.sel) return;
    S.sel = null;
    render();
    const back = lastTrigger && document.querySelector(`[data-key="${CSS.escape(lastTrigger)}"]`);
    if (back) back.focus();
  }

  /* ═════════════════ RENDER ═════════════════ */
  function render() {
    const focusKey = document.activeElement && document.activeElement.getAttribute && document.activeElement.getAttribute("data-key");
    document.documentElement.dataset.theme = S.theme;
    document.documentElement.dataset.direction = S.study;
    writeHash();
    renderStudyBar();
    const app = document.getElementById("app");
    app.dataset.study = S.study;
    app.dataset.state = S.state;
    if (S.study === "d") {
      renderD(app);
      renderNotes();
      if (focusKey) {
        const el = document.querySelector(`[data-key="${CSS.escape(focusKey)}"]`);
        if (el) el.focus({ preventScroll: true });
      }
      return;
    }
    if (!document.getElementById("titlebar")) app.innerHTML = SKELETON;
    renderTitle();
    renderSide();
    renderMain();
    renderRail();
    renderStatus();
    renderNotes();
    turnTelescope();
    if (focusKey) {
      const el = document.querySelector(`[data-key="${CSS.escape(focusKey)}"]`);
      if (el) el.focus({ preventScroll: true });
    }
  }

  function seg(label, key, opts, onPick) {
    return h("span", { class: "ctl" }, h("span", { class: "seg-label" }, label),
      h("span", { class: "seg", role: "group", "aria-label": label },
        opts.map(([v, text]) => h("button", {
          type: "button", "aria-pressed": String(S[key] === v), "data-key": `ctl:${key}:${v}`,
          on: { click: () => onPick(v) },

  }

  function renderStudyBar() {
    const bar = document.getElementById("studybar");
    bar.replaceChildren(
      h("h1", null, "Observatory · pixel-design study"),
      seg("Direction", "study", [["d", "D Living"], ["a", "A Courtyard"], ["b", "B Instrument"], ["c", "C Atlas"]], (v) => { S.study = v; render(); }),
      seg("State", "state", [["quiet", "Quiet"], ["overlap", "Overlap"], ["replay", "Replay"]], (v) => setState(v)),
      seg("Theme", "theme", [["night", "Night"], ["paper", "Paper"]], (v) => { S.theme = v; render(); }),
      h("span", { class: "ctl" }, h("span", { class: "seg-label" }, "Motion"),
        h("span", { class: "seg" }, h("button", {
          type: "button", "aria-pressed": String(motionOn()), "data-key": "ctl:motion",

    stopPlay();

    if (S.sel && v !== S.state && !(D.STATES[v] || {}).nodes?.some((n) => n.id === S.sel)) S.sel = null;

  function renderTitle() {
    const t = document.getElementById("titlebar");
